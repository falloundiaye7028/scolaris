services:
  db:
    image: postgres:16
    container_name: scolaris_db
    environment:
      POSTGRES_USER: scolaris
      POSTGRES_PASSWORD: scolaris_dev
      POSTGRES_DB: scolaris
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scolaris_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
