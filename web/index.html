<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCOLARIS PAY — Administration</title>
  <style>
    :root{--ink:#15251f;--muted:#6b7b75;--green:#123c32;--accent:#22a879;--pale:#eef8f4;--line:#e5ebe8;--warn:#e78b22;--danger:#c94848;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f5f7f6;color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:white}.auth-brand{background:linear-gradient(145deg,#0c3028,#195747);color:#fff;padding:9vw;display:flex;flex-direction:column;justify-content:center}.mark{font-size:13px;letter-spacing:.18em;font-weight:800}.auth-brand h1{font-size:clamp(42px,6vw,76px);line-height:.98;margin:20px 0}.auth-brand p{font-size:18px;max-width:500px;color:#cce3db}.auth-card{max-width:500px;width:86%;margin:auto}.auth-card h2{font-size:32px;margin:0 0 8px}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button,.ghost{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.tabs .active{background:var(--green);color:#fff}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #ced8d4;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #22a8791f}.primary{width:100%;border:0;background:var(--accent);color:#fff;font-weight:750;padding:13px 16px;border-radius:10px;cursor:pointer}.primary:disabled{opacity:.55}.msg{margin-top:14px;padding:11px;border-radius:9px;background:#fff2f2;color:#9c3434;font-size:14px}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:238px;background:var(--green);color:white;padding:26px 18px}.side .brand{font-weight:850;font-size:20px;padding:0 10px}.school-name{color:#b9d3ca;font-size:13px;padding:8px 10px 25px}.nav button{border:0;width:100%;background:transparent;color:#d6e5e0;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1a;color:#fff}.nav button span{display:inline-block;width:26px}.logout{position:absolute;bottom:24px;left:28px;color:#cbe0d9;background:none;border:0;cursor:pointer}.main{margin-left:238px;padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top h1{font-size:28px;margin:3px 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.user-chip{background:white;border:1px solid var(--line);padding:10px 14px;border-radius:30px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 5px 24px #193c3008}.card .k{font-size:13px;color:var(--muted)}.card .v{font-size:27px;font-weight:850;margin:8px 0}.green{color:#13845e}.orange{color:var(--warn)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section-head h2{margin:0;font-size:20px}.action{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafcfb}.empty{padding:42px;text-align:center;color:var(--muted)}.pill{font-size:12px;padding:5px 9px;border-radius:20px;background:var(--pale);color:#167655}.pill.warn{background:#fff4df;color:#a5630b}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.modal{position:fixed;inset:0;background:#10261fb8;display:grid;place-items:center;padding:20px;z-index:5}.modal-box{background:#fff;width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:17px;padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.close{border:0;background:#eef1f0;border-radius:50%;width:34px;height:34px;cursor:pointer}.toast{position:fixed;right:24px;bottom:24px;background:#183b31;color:#fff;padding:13px 18px;border-radius:11px;z-index:10}.loader{padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-brand{display:none}.auth-card{padding:45px 0}.side{position:static;width:auto;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{position:static}.main{margin:0;padding:20px}.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.top{align-items:flex-start}.user-chip{display:none}}
  </style>
</head>
<body>
<section id="auth" class="auth">
  <div class="auth-brand"><div class="mark">SCOLARIS PAY</div><h1>La scolarité<br>sous contrôle.</h1><p>Centralisez les élèves, les échéances, les encaissements et le recouvrement de votre établissement.</p></div>
  <div class="auth-card"><div class="eyebrow">Espace sécurisé</div><h2 id="authTitle">Connexion</h2><p id="authLead">Accédez à l’administration de votre établissement.</p><div class="tabs"><button id="loginTab" class="active">Se connecter</button><button id="registerTab">Créer mon école</button></div><form id="authForm"><div id="schoolFields" class="hidden"><div class="field"><label>Nom de l’établissement</label><input name="schoolName" placeholder="Ex. Institut Scolaris Dakar"></div><div class="field"><label>Votre nom complet</label><input name="name" placeholder="Nom de l’administrateur"></div><div class="field"><label>Devise</label><select name="currency"><option>XOF</option><option>EUR</option><option>USD</option><option>GBP</option><option>MAD</option><option>GNF</option><option>GMD</option><option>NGN</option></select></div></div><div class="field"><label>Adresse e-mail</label><input required type="email" name="email" placeholder="direction@ecole.sn"></div><div class="field"><label>Mot de passe</label><input required minlength="8" type="password" name="password" placeholder="8 caractères minimum"></div><button class="primary" id="authSubmit">Se connecter</button><div id="authMsg" class="msg hidden"></div></form></div>
</section>
<section id="app" class="shell hidden">
  <aside class="side"><div class="brand">SCOLARIS PAY</div><div id="schoolName" class="school-name">Administration</div><nav class="nav"><button data-view="dashboard" class="active"><span>◫</span>Tableau de bord</button><button data-view="students"><span>♙</span>Élèves</button><button data-view="invoices"><span>▤</span>Échéances</button><button data-view="payments"><span>◉</span>Paiements</button><button data-view="overdue"><span>!</span>Impayés</button></nav><button id="logout" class="logout">↪ Déconnexion</button></aside>
  <main class="main"><header class="top"><div><div class="eyebrow" id="dateLine"></div><h1 id="pageTitle">Tableau de bord</h1></div><div class="user-chip" id="userChip"></div></header><div id="content"></div></main>
</section>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button id="closeModal" class="close">×</button></div><form id="modalForm"></form></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), money=(n,c='XOF')=>{c=String(c||'XOF').trim().toUpperCase();try{return new Intl.NumberFormat('fr-FR',{style:'currency',currency:c,maximumFractionDigits:c==='XOF'?0:2}).format(Number(n||0)/100)}catch{return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(Number(n||0)/100)+' '+c}}, esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let token=localStorage.getItem('scolaris_token'), user=JSON.parse(localStorage.getItem('scolaris_user')||'null'), mode='login', cache={students:[],invoices:[],overdue:[]};
async function api(path,opt={}){const r=await fetch('/api'+path,{...opt,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok){if(r.status===401&&token)logout();throw Error(data.error||'Une erreur est survenue')}return data}
function setMode(next){mode=next;$('#loginTab').classList.toggle('active',next==='login');$('#registerTab').classList.toggle('active',next==='register');$('#schoolFields').classList.toggle('hidden',next==='login');$('#authTitle').textContent=next==='login'?'Connexion':'Créer votre établissement';$('#authLead').textContent=next==='login'?"Accédez à l’administration de votre établissement.":'Ouvrez votre espace administrateur en quelques secondes.';$('#authSubmit').textContent=next==='login'?'Se connecter':'Créer mon espace'}
$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');
$('#authForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const btn=$('#authSubmit'),msg=$('#authMsg');btn.disabled=true;msg.classList.add('hidden');try{const d=await api(mode==='login'?'/auth/login':'/auth/bootstrap',{method:'POST',body:JSON.stringify(f)});token=d.token;user=d.user;localStorage.setItem('scolaris_token',token);localStorage.setItem('scolaris_user',JSON.stringify(user));if(d.school)localStorage.setItem('scolaris_school',JSON.stringify(d.school));showApp()}catch(err){msg.textContent=err.message;msg.classList.remove('hidden')}finally{btn.disabled=false}};
function logout(){localStorage.removeItem('scolaris_token');localStorage.removeItem('scolaris_user');localStorage.removeItem('scolaris_school');token=null;user=null;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden')};$('#logout').onclick=logout;
async function showApp(){try{user=await api('/me');localStorage.setItem('scolaris_user',JSON.stringify(user))}catch{return}$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#userChip').textContent=user.name+' · '+user.role;const school=JSON.parse(localStorage.getItem('scolaris_school')||'null');$('#schoolName').textContent=school?.name||'Mon établissement';$('#dateLine').textContent=new Intl.DateTimeFormat('fr-FR',{dateStyle:'full'}).format(new Date());navigate('dashboard')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
async function navigate(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={dashboard:'Tableau de bord',students:'Élèves',invoices:'Échéances',payments:'Paiements',overdue:'Impayés'};$('#pageTitle').textContent=titles[view];$('#content').innerHTML='<div class="loader">Chargement…</div>';try{await ({dashboard:renderDashboard,students:renderStudents,invoices:renderInvoices,payments:renderPayments,overdue:renderOverdue}[view])()}catch(e){$('#content').innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}
async function loadCore(){[cache.students,cache.invoices]=await Promise.all([api('/students'),api('/invoices')])}
async function renderDashboard(){const [d,students,invoices]=await Promise.all([api('/dashboard'),api('/students'),api('/invoices')]);cache.students=students;cache.invoices=invoices;const currencies=[...new Set(invoices.map(x=>x.currency))];let expected=invoices.reduce((a,x)=>a+Number(x.amount_minor),0),paid=invoices.reduce((a,x)=>a+Number(x.paid_minor||0),0),cur=currencies.length===1?currencies[0]:'XOF';$('#content').innerHTML=`<section class="cards"><div class="card"><div class="k">Élèves actifs</div><div class="v">${students.length}</div><small>inscrits dans votre espace</small></div><div class="card"><div class="k">Montant attendu</div><div class="v">${money(expected,cur)}</div><small>${invoices.length} échéance(s)</small></div><div class="card"><div class="k">Encaissé</div><div class="v green">${money(paid,cur)}</div><small>paiements enregistrés</small></div><div class="card"><div class="k">À recevoir</div><div class="v orange">${money(expected-paid,cur)}</div><small>${Number(d.unpaid_count)||0} impayé(s)</small></div></section><div class="two" style="margin-top:15px"><div class="panel"><h3>Dernières échéances</h3>${invoices.slice(0,5).map(x=>`<div style="display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)"><span>${esc(x.first_name)} ${esc(x.last_name)} · ${esc(x.label)}</span><b>${money(x.amount_minor,x.currency)}</b></div>`).join('')||'<div class="empty">Ajoutez votre première échéance.</div>'}</div><div class="panel"><h3>Démarrage rapide</h3><p>1. Ajoutez vos élèves</p><p>2. Créez leurs échéances</p><p>3. Enregistrez les paiements</p><button class="action" onclick="navigate('students')">Commencer</button></div></div>`}
async function renderStudents(){cache.students=await api('/students');$('#content').innerHTML=`<div class="section-head"><h2>${cache.students.length} élève(s)</h2><button class="action" onclick="studentModal()">+ Ajouter un élève</button></div><div class="table-wrap">${cache.students.length?`<table><thead><tr><th>Matricule</th><th>Élève</th><th>Classe</th><th>Parent</th><th>Téléphone</th><th>Action</th></tr></thead><tbody>${cache.students.map(s=>`<tr><td>${esc(s.matricule)}</td><td>${esc(s.first_name+' '+s.last_name)}</td><td>${esc(s.class_name||'—')}</td><td>${esc(s.guardian_name||'—')}</td><td>${esc(s.guardian_phone||'—')}</td><td><button class="ghost" onclick="editStudent('${s.id}')">Modifier</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune donnée pour le moment.</div>'}</div>`}
async function renderInvoices(){await loadCore();$('#content').innerHTML=`<div class="section-head"><h2>${cache.invoices.length} échéance(s)</h2><button class="action" onclick="invoiceModal()">+ Nouvelle échéance</button></div>${table(['Élève','Libellé','Montant','Payé','Échéance','Statut'],cache.invoices.map(i=>[i.first_name+' '+i.last_name,i.label,money(i.amount_minor,i.currency),money(i.paid_minor,i.currency),i.due_date,status(i.status)]))}`}
async function renderPayments(){await loadCore();const unpaid=cache.invoices.filter(i=>i.status!=='paid'&&i.status!=='cancelled');const receipts=await api('/receipts');$('#content').innerHTML=`<div class="section-head"><h2>Encaissements</h2><button class="action" ${unpaid.length?'':'disabled'} onclick="paymentModal()">+ Enregistrer un paiement</button></div>${table(['Date','Élève','Montant','Méthode','Référence','Reçu'],receipts.map(r=>[new Date(r.issued_at).toLocaleDateString('fr-FR'),r.first_name+' '+r.last_name,money(r.amount_minor,r.currency),r.method,r.reference,r.number]))}`}
async function renderOverdue(){cache.overdue=await api('/collections/overdue');$('#content').innerHTML=`<div class="section-head"><h2>${cache.overdue.length} dossier(s) en retard</h2></div>${table(['Élève','Échéance','Date limite','Montant','Payé','Solde'],cache.overdue.map(i=>[i.first_name+' '+i.last_name,i.label,i.due_date,money(i.amount_minor,i.currency),money(i.paid_minor,i.currency),money(i.balance_minor,i.currency)]))}`}
function table(head,rows){return `<div class="table-wrap">${rows.length?`<table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</tbody></table>`:'<div class="empty">Aucune donnée pour le moment.</div>'}</div>`}function status(s){return ({paid:'Payée',partial:'Partielle',unpaid:'Impayée',cancelled:'Annulée'})[s]||s}
function openModal(title,html,submit){$('#modalTitle').textContent=title;$('#modalForm').innerHTML=html+'<button class="primary" style="margin-top:12px">Enregistrer</button><div id="modalMsg" class="msg hidden"></div>';$('#modal').classList.remove('hidden');$('#modalForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button'),msg=$('#modalMsg');btn.disabled=true;try{await submit(Object.fromEntries(new FormData(e.target)));closeModal();toast('Enregistrement effectué')}catch(err){msg.textContent=err.message;msg.classList.remove('hidden')}finally{btn.disabled=false}}}function closeModal(){$('#modal').classList.add('hidden')}$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2800)}
function studentModal(){openModal('Ajouter un élève',fields([['matricule','Matricule','text'],['firstName','Prénom','text'],['lastName','Nom','text'],['className','Classe','text'],['guardianName','Nom du parent','text'],['guardianPhone','Téléphone du parent','tel']]),async f=>{await api('/students',{method:'POST',body:JSON.stringify(f)});navigate('students')})}
function editStudent(id){const s=cache.students.find(x=>x.id===id);if(!s)return;const input=(n,l,t,v,required=true)=>`<div class="field"><label>${l}</label><input ${required?'required':''} name="${n}" type="${t}" value="${esc(v||'')}"></div>`;openModal('Modifier l’élève',input('matricule','Matricule','text',s.matricule)+input('firstName','Prénom','text',s.first_name)+input('lastName','Nom','text',s.last_name)+input('className','Classe','text',s.class_name,false)+input('guardianName','Nom du parent','text',s.guardian_name,false)+input('guardianPhone','Téléphone du parent','tel',s.guardian_phone,false),async f=>{await api('/students/'+id,{method:'PUT',body:JSON.stringify(f)});navigate('students')})}
function invoiceModal(){if(!cache.students.length)return toast('Ajoutez d’abord un élève');openModal('Créer une échéance',`<div class="field"><label>Élève</label><select name="studentId">${cache.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name+' — '+s.matricule)}</option>`).join('')}</select></div>${fields([['label','Libellé','text'],['amount','Montant','number'],['currency','Devise','text'],['dueDate','Date limite','date']])}`,async f=>{await api('/invoices',{method:'POST',body:JSON.stringify({...f,amountMinor:Math.round(Number(f.amount)*100)})});navigate('invoices')})}
function paymentModal(){const inv=cache.invoices.filter(i=>i.status!=='paid'&&i.status!=='cancelled');openModal('Enregistrer un paiement',`<div class="field"><label>Échéance</label><select name="invoiceId" id="invoiceSelect">${inv.map(i=>`<option value="${i.id}" data-currency="${i.currency}">${esc(i.first_name+' '+i.last_name+' — '+i.label+' — '+money(Number(i.amount_minor)-Number(i.paid_minor),i.currency))}</option>`).join('')}</select></div>${fields([['amount','Montant encaissé','number'],['method','Méthode (espèces, mobile money…)','text'],['reference','Référence','text']])}`,async f=>{const i=inv.find(x=>x.id===f.invoiceId);await api('/payments',{method:'POST',body:JSON.stringify({...f,amountMinor:Math.round(Number(f.amount)*100),currency:i.currency})});navigate('payments')})}
function fields(xs){return xs.map(([n,l,t])=>`<div class="field"><label>${l}</label><input required name="${n}" type="${t}" ${t==='number'?'min="0" step="0.01"':''}></div>`).join('')}
if(token)showApp();
</script></body></html>
