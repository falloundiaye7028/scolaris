<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Réinitialiser le mot de passe — SCOLARIS PAY</title><link rel="icon" href="/brand-icon.png" type="image/png" sizes="260x260"><link rel="apple-touch-icon" href="/brand-icon.png"><link rel="stylesheet" href="/public.css"><link rel="stylesheet" href="/brand.css"><script src="/password-reset.js" defer></script></head><body class="login-page"><main class="confirmation-layout"><section class="confirmation-card"><a class="brand" href="/"><img src="/brand-icon.png" alt="" width="48" height="48"><span class="brand-wordmark"><span class="brand-scolaris">SCOLARIS</span><span class="brand-pay">PAY</span></span></a><p class="eyebrow">Récupération sécurisée</p><div id="requestSection"><h1>Mot de passe oublié</h1><p>Indiquez l’adresse e-mail de votre compte. Si celui-ci peut être récupéré, un lien valable 30 minutes sera envoyé.</p><form id="requestForm"><div class="field"><label for="resetEmail">Adresse e-mail</label><input id="resetEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required></div><button id="requestButton" class="button full" type="submit">Envoyer le lien</button></form></div><div id="confirmSection" hidden><h1>Nouveau mot de passe</h1><p>Utilisez au moins 12 caractères, avec des lettres et un chiffre.</p><form id="confirmForm"><div class="field"><label for="newPassword">Nouveau mot de passe</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><div class="field"><label for="passwordConfirmation">Confirmer le mot de passe</label><input id="passwordConfirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><button id="confirmButton" class="button full" type="submit">Mettre à jour le mot de passe</button></form></div><p id="resetStatus" class="form-status" role="status" aria-live="polite"></p><a class="back" href="/connexion">← Retour à la connexion</a></section></main></body></html>
