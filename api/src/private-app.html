  <style>
    :root{--ink:#15251f;--muted:#6b7b75;--green:#123c32;--accent:#22a879;--pale:#eef8f4;--line:#e5ebe8;--warn:#e78b22;--danger:#c94848;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f5f7f6;color:var(--ink)}button,input,select{font:inherit;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}.hidden{display:none!important}.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:white}.auth-brand{background:linear-gradient(145deg,#0c3028,#195747);color:#fff;padding:9vw;display:flex;flex-direction:column;justify-content:center}.mark{font-size:13px;letter-spacing:.18em;font-weight:800}.auth-brand h1{font-size:clamp(42px,6vw,76px);line-height:.98;margin:20px 0}.auth-brand p{font-size:18px;max-width:500px;color:#cce3db}.auth-card{max-width:500px;width:86%;margin:auto}.auth-card h2{font-size:32px;margin:0 0 8px}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button,.ghost{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.tabs .active{background:var(--green);color:#fff}.ghost.danger{color:var(--danger);border-color:#efcaca}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #ced8d4;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #22a8791f}.primary{width:100%;border:0;background:var(--accent);color:#fff;font-weight:750;padding:13px 16px;border-radius:10px;cursor:pointer}.primary:disabled{opacity:.55}.whatsapp{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:12px 15px;border-radius:10px;background:#25d366;color:#fff;text-decoration:none;font-weight:800}.whatsapp:hover{background:#1fbd5a}.msg{margin-top:14px;padding:11px;border-radius:9px;background:#fff2f2;color:#9c3434;font-size:14px}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:238px;background:var(--green);color:white;padding:26px 18px}.side .brand{font-weight:850;font-size:20px;padding:0 10px}.school-name{color:#b9d3ca;font-size:13px;padding:8px 10px 25px}.nav button{border:0;width:100%;background:transparent;color:#d6e5e0;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1a;color:#fff}.nav button span{display:inline-block;width:26px}.logout{position:absolute;bottom:24px;left:28px;color:#cbe0d9;background:none;border:0;cursor:pointer}.main{margin-left:238px;padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top h1{font-size:28px;margin:3px 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.user-chip{background:white;border:1px solid var(--line);padding:10px 14px;border-radius:30px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 5px 24px #193c3008}.card .k{font-size:13px;color:var(--muted)}.card .v{font-size:27px;font-weight:850;margin:8px 0}.green{color:#13845e}.orange{color:var(--warn)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px;gap:12px;flex-wrap:wrap}.section-head h2{margin:0;font-size:20px}.action{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafcfb}.empty{padding:42px;text-align:c <body>
<section id="app" class="shell">
  <aside class="side"><div class="brand">SCOLARIS PAY</div><div id="schoolName" class="school-name">Administration</div><nav class="nav"><button id="clientsNav" data-view="clients" class="hidden"><span>◆</span>Abonnements</button><button class="schoolFeature" data-view="dashboard"><span>◫</span>Tableau de bord</button><button class="schoolFeature" data-view="students"><span>♙</span>Élèves</button><button class="schoolFeature" data-view="invoices"><span>▤</span>Échéances</button><button class="schoolFeature" data-view="payments"><span>◉</span>Paiements scolaires</button><button class="schoolFeature" data-view="overdue"><span>!</span>Impayés</button><button id="subscriptionNav" data-view="subscription"><span>◇</span>Mon abonnement</button><button data-view="security"><span>⚿</span>Sécurité</button></nav><button id="logout" class="logout">↪ Déconnexion</button></aside>
  <main class="main"><header class="top"><div><div class="eyebrow" id="dateLine"></div><h1 id="pageTitle">Tableau de bord</h1></div><div class="user-chip" id="userChip"></div></header><div id="content"></div></main>
</section>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button id="closeModal" class="close" type="button" aria-label="Fermer">×</button></div><form id="modalForm"></form></div></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/security.js"></script><script>
const $=s=>document.querySelector(s), money=(n,c='XOF')=>{c=String(c||'XOF').trim().toUpperCase();try{return new Intl.NumberFormat('fr-FR',{style:'currency',currency:c,maximumFractionDigits:c==='XOF'?0:2}).format(Number(n||0)/100)}catch{return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(Number(n||0)/100)+' '+c}}, esc=window.ScolarisSecurity.escapeHtml;
let user=null, pendingMfaSecret='', pendingRecoveryCodes=[], cache={students:[],invoices:[],overdue:[]};
const actionHandlers={approveClient,cancelSubscriptionPaymentModal,changePasswordModal,clientModal,clientPaymentModal,copyMfaSecret,copyRecoveryCodes,deleteClientModal,disableMfaModal,downloadPayments,downloadStudents,downloadSubscriptionPayments,drawOverdue,editStudent,filterClients,filterSubscriptionPeriod,importStudentsModal,invoiceModal,navigate,paymentModal,printReceipt,printStudentStatement,reactivateClient,receiptModal,registrationDetailsModal,rejectClientModal,reviewClientModal,revokeSession,startMfaSetup,studentModal,studentStatement,suspendClient,toggleCustomFee,updateStudentList};
function toggleCustomFee(value){document.getElementById('customFee')?.classList.toggle('hidden',value!=='other')}
function runAction(element,expression=element.dataset.action||''){const match=/^([A-Za-z][A-Za-z0-9]*)\((.*)\)$/.exec(expression);if(!match||!Object.hasOwn(actionHandlers,match[1]))return;const raw=match[2].trim();let args=[];if(raw==='this.value')args=[element.value];else if(raw){const quoted=/^'([A-Za-z0-9_-]{1,100})'$/.exec(raw);if(!quoted)return;args=[quoted[1]]}Promise.resolve(actionHandlers[match[1]](...args)).catch(error=>toast(error?.message||'Action impossible'))}
document.addEventListener('click',event=>{const element=event.target.closest('[data-action]');if(element&&!element.disabled)runAction(element)});document.addEventListener('change',event=>{if(event.target.matches('[data-change]'))runAction(event.target,event.target.dataset.change)});document.addEventListener('input',event=>{if(event.target.matches('[data-input]'))runAction(event.target,event.target.dataset.input)});
let accessibleFieldId=0;function associateLabels(root=document){root.querySelectorAll?.('.field label:not([for])').forEach(label=>{const control=label.parentElement?.querySelector('input,select,textarea');if(control){control.id=control.id||`field-${++accessibleFieldId}`;label.htmlFor=control.id}})}new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)associateLabels(node)}))).observe(document.body,{childList:true,subtree:true});associateLabels();
async function requestReauthentication(){const password=window.prompt('Confirmez votre mot de passe pour continuer cette opération sensible.');if(!password)return false;const response=await fetch('/api/auth/reauthenticate',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password})});return response.ok}
async function secureFetch(url,opt={},retried=false){const response=await fetch(url,{...opt,credentials:'same-origin',headers:{...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})}});if(response.status===428&&!retried){const detail=await response.clone().json().catch(()=>({}));if(detail.code==='mfa_enrollment_required'){navigate('security');return response}if(await requestReauthentication())return secureFetch(url,opt,true)}if(response.status===401){location.replace('/connexion');throw Error('Session expirée')}return response}
async function api(path,opt={}){const r=await secureFetch('/api'+path,opt);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw Error(data.error||'Une erreur est survenue');return data}
async function logout(){try{await api('/auth/logout',{method:'POST',body:'{}'})}finally{location.replace('/connexion')}}$('#logout').onclick=logout;
async function showApp(){try{user=await api('/me')}catch{return}const schoolDataAllowed=['active','grace_period','suspended'].includes(user.school_status);$('#clientsNav').classList.toggle('hidden',!user.platformAdmin);$('#subscriptionNav').classList.toggle('hidden',user.platformAdmin);document.querySelectorAll('.schoolFeature').forEach(node=>node.classList.toggle('hidden',user.platformAdmin||!schoolDataAllowed));$('#userChip').textContent=user.name+' · '+(user.platformAdmin?'Super-administrateur':user.role);$('#schoolName').textContent=user.platformAdmin?'Administration plateforme':user.school_name;$('#dateLine').textContent=new Intl.DateTimeFormat('fr-FR',{dateStyle:'full'}).format(new Date());navigate(user.mfaEnrollmentRequired&&!user.mfaEnabled?'security':user.platformAdmin?'clients':schoolDataAllowed?'dashboard':'subscription')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
async function navigate(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={clients:'Abonnements des établissements',dashboard:'Tableau de bord',students:'Élèves',invoices:'Échéances',payments:'Paiements scolaires',overdue:'Impayés',subscription:'Mon abonnement',security:'Sécurité du compte'};$('#pageTitle').textContent=titles[view];$('#content').innerHTML='<div class="loader">Chargement…</div>';try{await ({clients:renderClients,dashboard:renderDashboard,students:renderStudents,invoices:renderInvoices,payments:renderPayments,overdue:renderOverdue,subscription:renderSubscription,security:renderSecurity}[view])()}catch(e){$('#content').innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}
async function renderSecurity(){const [profile,sessions]=await Promise.all([api('/me'),api('/auth/sessions')]);user=profile;const required=profile.mfaEnrollmentRequired&&!profile.mfaEnabled;$('#content').innerHTML=`${required?'<div class="msg"><b>Action requise :</b> activez la vérification en deux étapes pour accéder aux fonctions sensibles.</div>':''}<div class="two" style="margin-top:15px"><section class="panel"><h2>Vérification en deux étapes</h2><p>${profile.mfaEnabled?'La MFA est active sur ce compte. Un code temporaire est demandé après le mot de passe.':'La MFA protège le compte même si le mot de passe est compromis.'}</p><button type="button" class="action" data-action="${profile.mfaEnabled?'disableMfaModal()':'startMfaSetup()'}">${profile.mfaEnabled?'Désactiver la MFA':'Activer la MFA'}</button></section><section class="panel"><h2>Mot de passe</h2><p>Utilisez au moins 12 caractères, avec des lettres et un chiffre.</p><button type="button" class="action" data-action="changePasswordModal()">Changer le mot de passe</button></section></div><div class="section-head"><h2>Sessions actives (${sessions.sessions.length}/${sessions.maximum})</h2></div><div class="table-wrap"><table><thead><tr><th>Ouverture</th><th>Dernière activité</th><th>Expiration absolue</th><th>Méthode</th><th>Action</th></tr></thead><tbody>${sessions.sessions.map(s=>`<tr><td>${new Date(s.created_at).toLocaleString('fr-FR')}${s.current?' · <b>Cette session</b>':''}</td><td>${new Date(s.last_seen_at).toLocaleString('fr-FR')}</td><td>${new Date(s.absolute_expires_at).toLocaleString('fr-FR')}</td><td>${esc(s.auth_method)}</td><td><button type="button" class="ghost" data-action="revokeSession('${s.id}')">Révoquer</button></td></tr>`).join('')}</tbody></table></div>`}
async function startMfaSetup(){const result=await api('/auth/mfa/setup',{method:'POST',body:'{}'}),uri=new URL(result.provisioningUri);pendingMfaSecret=uri.searchParams.get('secret')||'';openModal('Activer la vérification en deux étapes',`<p>Dans votre application d’authentification, ajoutez un compte manuellement avec la clé ci-dessous, type TOTP, 6 chiffres, période 30 secondes.</p><div class="panel"><code style="overflow-wrap:anywhere">${esc(pendingMfaSecret)}</code></div><button type="button" class="ghost" style="margin-top:10px" data-action="copyMfaSecret()">Copier la clé</button><div class="field"><label>Premier code à 6 chiffres</label><input required name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></div>`,async f=>{const confirmed=await api('/auth/mfa/confirm',{method:'POST',body:JSON.stringify({code:f.code})});pendingRecoveryCodes=confirmed.recoveryCodes||[];user.mfaEnabled=true;setTimeout(showRecoveryCodes,0)})}
async function copyMfaSecret(){await navigator.clipboard.writeText(pendingMfaSecret);toast('Clé MFA copiée')}
function showRecoveryCodes(){$('#modalTitle').textContent='Codes de récupération';$('#modalForm').innerHTML=`<div class="msg"><b>À conserver maintenant.</b> Chaque code ne fonctionne qu’une fois. SCOLARIS PAY ne pourra pas les afficher de nouveau.</div><pre class="panel" style="white-space:pre-wrap;line-height:1.8">${esc(pendingRecoveryCodes.join('\n'))}</pre><button type="button" class="primary" data-action="copyRecoveryCodes()">Copier les codes</button>`;$('#modalForm').onsubmit=e=>e.preventDefault();$('#modal').classList.remove('hidden');navigate('security')}
async function copyRecoveryCodes(){await navigator.clipboard.writeText(pendingRecoveryCodes.join('\n'));toast('Codes de récupération copiés')}
function disableMfaModal(){openModal('Désactiver la MFA','<div class="msg">Cette action réduit la protection du compte et révoque les autres sessions.</div><div class="field"><label>Mot de passe actuel</label><input required name="password" type="password" autocomplete="current-password" maxlength="128"></div>',async f=>{await api('/auth/mfa',{method:'DELETE',body:JSON.stringify({password:f.password})});user.mfaEnabled=false;navigate('security')})}
function changePasswordModal(){openModal('Changer le mot de passe','<div class="field"><label>Mot de passe actuel</label><input required name="currentPassword" type="password" autocomplete="current-password" maxlength="128"></div><div class="field"><label>Nouveau mot de passe</label><input required name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><div class="field"><label>Confirmer le nouveau mot de passe</label><input required name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div>',async f=>{if(f.newPassword!==f.confirmation)throw Error('Les nouveaux mots de passe ne correspondent pas');await api('/auth/password/change',{method:'POST',body:JSON.stringify({currentPassword:f.currentPassword,newPassword:f.newPassword})});toast('Mot de passe modifié');navigate('security')})}
async function revokeSession(id){if(!confirm('Révoquer cette session ?'))return;const result=await api('/auth/sessions/'+id,{method:'DELETE',body:'{}'});if(result.current){location.replace('/connexion');return}toast('Session révoquée');navigate('security')}
async function loadCore(){[cache.students,cache.invoices]=await Promise.all([api('/students'),api('/invoices')])}
function subscriptionStatusLabel(value){return ({pending_email:'E-mail à confirmer',pending_review:'À examiner',pending_payment:'En attente de paiement',active:'Actif',grace_period:'Délai de grâce',suspended:'Suspendu',rejected:'Refusé',cancelled:'Désactivé'})[value]||value}
function platformMethodLabel(value){return ({cash:'Espèces',wave:'Wave',orange_money:'Orange Money',bank_transfer:'Virement',cheque:'Chèque',other:'Autre'})[value]||value}
function filterClients(value){cache.clientFilter=value;navigate('clients')}
function filterSubscriptionPeriod(value){cache.paymentPeriod=value;navigate('clients')}
function subscriptionPeriodQuery(value){const now=new Date(),first=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1)),next=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+1,1));if(value==='previous'){const previous=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-1,1));return`?from=${previous.toISOString().slice(0,10)}&to=${first.toISOString().slice(0,10)}`}if(value==='all')return'';return`?from=${first.toISOString().slice(0,10)}&to=${next.toISOString().slice(0,10)}`}
async function renderSubscription(){const data=await api('/school/subscription'),label=subscriptionStatusLabel(data.schoolStatus),warn=['grace_period','suspended','pending_payment','pending_review','pending_email'].includes(data.schoolStatus),due=data.paidUntil?new Date(data.paidUntil).toLocaleDateString('fr-FR'):'Non définie',pending=['pending_email','pending_review','pending_payment','rejected'].includes(data.schoolStatus);cache.subscriptionData=data;$('#content').innerHTML=`<section class="cards"><div class="card"><div class="k">Formule</div><div class="v">${esc(data.offer)}</div><small>cycle mensuel fixe</small></div><div class="card"><div class="k">Tarif mensuel</div><div class="v green">${money(Number(data.monthlyPriceXof)*100,data.currency)}</div><small>par établissement</small></div><div class="card"><div class="k">Statut</div><div class="v ${warn?'orange':'green'}">${esc(label)}</div><small>${data.gracePeriodDays} jours de grâce après échéance</small></div><div class="card"><div class="k">Prochaine échéance</div><div class="v">${esc(due)}</div><small>${data.gracePeriodEnd?'Grâce possible jusqu’au '+new Date(data.gracePeriodEnd).toLocaleDateString('fr-FR'):'Activation après validation du règlement'}</small></div></section><div class="two" style="margin-top:15px"><section class="panel"><h2>Règlement de l’abonnement</h2><p>${esc(data.instructions)}</p><p><b>Aucun paiement en ligne n’est collecté sur SCOLARIS PAY.</b> Transmettez votre règlement et sa référence à l’équipe, qui l’enregistrera manuellement après vérification.</p><a class="whatsapp" href="https://wa.me/${String(data.support.whatsapp).replace(/\D/g,'')}" target="_blank" rel="noopener noreferrer">Contacter SCOLARIS PAY sur WhatsApp</a></section><section class="panel"><h2>Accès à votre espace</h2><p>${data.schoolStatus==='active'?'Votre espace est actif avec toutes ses fonctions.':data.schoolStatus==='grace_period'?'Votre espace est temporairement en lecture seule pendant le délai de grâce.':data.sch function receiptModal(id){const r=(cache.receipts||[]).find(x=>x.id===id);if(!r)return;$('#modalTitle').textContent='Reçu de paiement';$('#modalForm').innerHTML=`<div class="panel" id="receiptPreview"><div class="mark" style="color:var(--green)">SCOLARIS PAY</div><h2 style="margin-bottom:4px">Reçu ${esc(r.number)}</h2><p style="color:var(--muted)">${esc(r.school_name)}</p><hr style="border:0;border-top:1px solid var(--line)"><p><b>Élève :</b> ${esc(r.first_name+' '+r.last_name)}<br><b>Matricule :</b> ${esc(r.matricule)}<br><b>Classe :</b> ${esc(r.class_name||'—')}<br><b>Échéance :</b> ${esc(r.invoice_label||'—')}</p><p><b>Montant payé :</b> ${money(r.amount_minor,r.currency)}<br><b>Date :</b> ${new Date(r.paid_at||r.issued_at).toLocaleDateString('fr-FR')}<br><b>Méthode :</b> ${esc(r.method)}<br><b>Référence :</b> ${esc(r.reference)}</p></div><button type="button" class="primary" style="margin-top:14px" data-action="printReceipt('${r.id}')">Imprimer / Enregistrer en PDF</button>`;$('#modalForm').onsubmit=e=>e.preventDefault();$('#modal').classList.remove('hidden')}
function printReceipt(id){const r=(cache.receipts||[]).find(x=>x.id===id);if(!r)return;openPrintDocument(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Reçu ${esc(r.number)}</title><style>body{font-family:Arial,sans-serif;color:#15251f;padding:45px;max-width:680px;margin:auto}h1{color:#123c32}.box{border:1px solid #dfe7e3;border-radius:14px;padding:24px;line-height:1.8}.amount{font-size:28px;font-weight:bold;color:#16845f}small{color:#6b7b75}@media print{body{padding:10px}}</style></head><body><h1>SCOLARIS PAY</h1><h2>Reçu de paiement</h2><div class="box"><p><b>${esc(r.school_name)}</b><br><small>Reçu n° ${esc(r.number)}</small></p><p>Élève : <b>${esc(r.first_name+' '+r.last_name)}</b><br>Matricule : ${esc(r.matricule)}<br>Classe : ${esc(r.class_name||'—')}<br>Échéance : ${esc(r.invoice_label||'—')}</p><p class="amount">${money(r.amount_minor,r.currency)}</p><p>Date : ${new Date(r.paid_at||r.issued_at).toLocaleDateString('fr-FR')}<br>Méthode : ${esc(r.method)}<br>Référence : ${esc(r.reference)}</p></div></body></html>`,'width=760,height=820')}
function table(head,rows){return `<div class="table-wrap">${rows.length?`<table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</tbody></table>`:'<div class="empty">Aucune donnée pour le moment.</div>'}</div>`}function status(s){return ({paid:'Payée',partial:'Partielle',unpaid:'Impayée',cancelled:'Annulée'})[s]||s}
function openModal(title,html,submit){$('#modalTitle').textContent=title;$('#modalForm').innerHTML=html+'<button class="primary" style="margin-top:12px">Enregistrer</button><div id="modalMsg" class="msg hidden" role="status" aria-live="polite"></div>';$('#modalForm').querySelectorAll('.field').forEach((field,index)=>{const control=field.querySelector('input,select,textarea'),label=field.querySelector('label');if(control&&label){control.id=control.id||`modalField${index}`;label.htmlFor=control.id}});$('#modal').classList.remove('hidden');$('#modalForm').querySelector('input,select,button')?.focus();$('#modalForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button'),msg=$('#modalMsg');btn.disabled=true;btn.setAttribute('aria-busy','true');try{await submit(Object.fromEntries(new FormData(e.target)));closeModal();toast('Enregistrement effectué')}catch(err){msg.textContent=err.message;msg.classList.remove('hidden')}finally{btn.disabled=false;btn.removeAttribute('aria-busy')}}}function closeModal(){if($('#modalTitle').textContent.includes('récupération'))pendingRecoveryCodes=[];if($('#modalTitle').textContent.includes('vérification en deux étapes'))pendingMfaSecret='';$('#modal').classList.add('hidden')}$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2800)}
function studentModal(){openModal('Ajouter un élève','<p>Le matricule sera généré automatiquement pour cet établissement.</p>'+fields([['firstName','Prénom','text'],['lastName','Nom','text'],['className','Classe','text'],['guardianName','Nom du parent','text'],['guardianPhone','Téléphone du parent','tel']]),async f=>{await api('/students',{method:'POST',body:JSON.stringify(f)});navigate('students')})}
async function downloadFile(path,name,message){const r=await secureFetch(path);if(!r.ok)throw Error('Téléchargement impossible');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(message)}

function importStudentsModal(){let payload=null,preview=null;$('#modalTitle').textContent='Importer des élèves';$('#modalForm').innerHTML=`<p>Formats acceptés : Excel .xlsx ou CSV. Colonnes obligatoires : <b>prénom, nom</b>. Le matricule est facultatif et sera généré automatiquement s’il manque. Colonnes facultatives : classe, parent, téléphone.</p><div class="field"><label>Fichier des élèves</label><input required id="studentFile" type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div><div id="importPreview"></div><button class="primary" id="importBtn">Analyser le fichier</button><div id="modalMsg" class="msg hidden"></div>`;$('#modal').classList.remove('hidden');$('#modalForm').onsubmit=async e=>{e.preventDefault();const btn=$('#importBtn'),msg=$('#modalMsg');btn.disabled=true;msg.classList.add('hidden');try{if(!payload){const file=$('#studentFile').files[0];if(!file)throw Error('Choisissez un fichier');const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));payload={fileName:file.name,mimeType:file.type||(/\.csv$/i.test(file.name)?'text/csv':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),fileBase64:btoa(binary)};preview=await api('/students/import',{method:'POST',body:JSON.stringify({...payload,preview:true})});$('#importPreview').innerHTML=`<div class="panel" style="margin:14px 0"><b>${preview.valid} ligne(s) valide(s)</b><p>${preview.invalidLines.length?`Lignes invalides : ${preview.invalidLines.join(', ')}`:'Aucune ligne invalide.'}</p><small>Aperçu : ${preview.sample.slice(0,3).map(x=>esc((x.matricule||'Matricule automatique')+' — '+x.firstName+' '+x.lastName)).join('<br>')}</small></div>`;btn.textContent=`Importer ${preview.valid} élève(s)`;btn.disabled=false;return}const result=await api('/students/import',{method:'POST',body:JSON.stringify(payload)});closeModal();toast(`${result.imported} élève(s) importé(s), ${result.duplicates} doublon(s)`);navigate('students')}catch(err){msg.textContent=err.message;msg.classList.remove('hidden')}finally{btn.disabled=false}}}
function registrationDetailsModal(){const r=cache.subscriptionData?.registration||{},types=[['public','Public'],['private','Privé'],['community','Communautaire'],['religious','Confessionnel'],['vocational','Formation professionnelle'],['higher_education','Enseignement supérieur'],['other','Autre']];openModal('Compléter les informations de l’établissement',`<div class="field"><label>Type d’établissement</label><select required name="schoolType">${types.map(([value,label])=>`<option value="${value}" ${r.schoolType===value?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label>Pays</label><input required minlength="2" maxlength="80" name="country" value="${esc(r.country||'Sénégal')}"></div><div class="field"><label>Ville</label><input required minlength="2" maxlength="120" name="city" value="${esc(r.city)}"></div><div class="field"><label>Adresse</label><input required minlength="4" maxlength="240" name="address" value="${esc(r.address)}"></div><div class="field"><label>Téléphone de l’établissement</label><input required name="schoolPhone" type="tel" value="${esc(r.schoolPhone)}"></div><div class="field"><label>Nombre approximatif d’élèves</label><input required min="1" max="200000" name="approximateStudentCount" type="number" value="${esc(r.approximateStudentCount)}"></div><div class="field"><label>NINEA (facultatif)</label><input maxlength="80" name="ninea" value="${esc(r.ninea)}"></div><div class="field"><label>RCCM (facultatif)</label><input maxlength="100" name="rccm" value="${esc(r.rccm)}"></div><div class="field"><label>Fonction du responsable</label><input required minlength="2" maxlength="120" name="representativeTitle" value="${esc(r.representativeTitle)}"></div><div class="field"><label>Téléphone du responsable</label><input required name="representativePhone" type="tel" value="${esc(r.representativePhone)}"></div>`,async f=>{await api('/school/registration',{method:'PUT',body:JSON.stringify({...f,approximateStudentCount:Number(f.approximateStudentCount)})});navigate('subscription')})}
function clientModal(){openModal('Créer un établissement manuellement',`<div class="msg">Le compte sera créé en attente de paiement. Le tarif reste fixé à 50 000 FCFA par mois.</div>`+fields([['schoolName','Nom de l’établissement','text'],['name','Nom du responsable','text'],['email','E-mail professionnel et de connexion','email'],['password','Mot de passe temporaire','password']]),async f=>{await api('/platform/clients',{method:'POST',body:JSON.stringify(f)});navigate('clients')})}
function reviewClientModal(id){const c=cache.clients.find(x=>x.id===id);if(!c)return;$('#modalTitle').textContent='Vérifier l’établissement';$('#modalForm').innerHTML=`<div class="panel"><h3>${esc(c.name)}</h3><p><b>Responsable :</b> ${esc(c.owner_name||'—')}<br><b>E-mail professionnel :</b> ${esc(c.professional_email||'—')}<br><b>E-mail de connexion :</b> ${esc(c.owner_email||'—')}<br><b>Type :</b> ${esc(c.school_type||'—')}<br><b>Localisation :</b> ${esc([c.address,c.city,c.country].filter(Boolean).join(', ')||'—')}<br><b>Téléphone :</b> ${esc(c.phone||'—')}<br><b>Élèves estimés :</b> ${esc(c.approximate_student_count||'—')}<br><b>NINEA :</b> ${esc(c.ninea||'Non fourni')}<br><b>RCCM :</b> ${esc(c.rccm||'Non fourni')}<br><b>E-mail confirmé :</b> ${c.email_verified_at?'Oui, le '+new Date(c.email_verified_at).toLocaleDateString('fr-FR'):'Non'}</p></div><button type="button" class="primary" data-action="approveClient('${c.id}')">Approuver la demande</button><button type="button" class="ghost danger" data-action="rejectClientModal('${c.id}')">Refuser avec un motif</button>`;$('#modalForm').onsubmit=e=>e.preventDefault();$('#modal').classList.remove('hidden')}
async function approveClient(id){if(!confirm('Approuver cet établissement ? Son accès restera en attente jusqu’à l’enregistrement d’un règlement.'))return;await api('/platform/clients/'+id+'/review',{method:'PUT',body:JSON.stringify({action:'approve'})});closeModal();toast('Établissement approuvé, en attente de paiement');navigate('clients')}
function rejectClientModal(id){openModal('Refuser la demande',`<div class="msg">Le motif est obligatoire et sera conservé dans l’audit.</div><div class="field"><label>Motif du refus</label><input required minlength="8" maxlength="500" name="reason" type="text"></div>`,async f=>{await api('/platform/clients/'+id+'/review',{method:'PUT',body:JSON.stringify({action:'reject',reason:f.reason})});navigate('clients')})}

function deleteClientModal(id){const c=cache.clients.find(x=>x.id===id);openModal('Désactiver l’établissement',`<div class="msg"><b>Désactivation immédiate</b><br>Les utilisateurs seront déconnectés et bloqués. Les élèves, échéances et paiements restent conservés pour audit et restauration.</div><p>Pour confirmer, saisissez exactement : <b>${esc(c.name)}</b></p><div class="field"><label>Nom de l’établissement</label><input required name="confirmationName" type="text" autocomplete="off"></div>`,async f=>{await api('/platform/clients/'+id,{method:'DELETE',body:JSON.stringify(f)});closeModal();toast('Établissement désactivé, données conservées');navigate('clients')})}
async function reactivateClient(id){if(!confirm('Réactiver cet établissement à partir de sa couverture déjà réglée ?'))return;await api('/platform/clients/'+id+'/subscription',{method:'PUT',body:JSON.stringify({action:'reactivate'})});toast('Établissement réactivé');navigate('clients')}
async function fileToProof(file){if(!file||!file.size)return null;if(file.size>2097152)throw Error('Le justificatif ne doit pas dépasser 2 Mo');const allowed=['application/pdf','image/png','image/jpeg'];if(!allowed.includes(file.type))throw Error('Le justificatif doit être un PDF, PNG ou JPEG');const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));return{name:file.name,contentType:file.type,base64:btoa(binary)}}
function clientPaymentModal(id){const c=cache.clients.find(x=>x.id===id),today=new Date().toISOString().slice(0,10);openModal('Enregistrer un règlement d’abonnement',`<div class="msg"><b>${esc(c?.name||'Établissement')}</b><br>Tarif contractuel : 50 000 FCFA pour un mois. Cette opération enregistre un règlement déjà reçu hors de la plateforme.</div><div class="field"><label>Montant enregistré en FCFA</label><input required min="50000" step="1" name="amountReceivedXof" type="number" value="50000"></div><div class="field"><label>Moyen déclaré</label><select required name="paymentMethod"><option value="cash">Espèces</option><option value="wave">Wave</option><option value="orange_money">Orange Money</option><option value="bank_transfer">Virement</option><option value="cheque">Chèque</option><option value="other">Autre</option></select></div><div class="field"><label>Référence externe</label><input maxlength="120" name="externalReference" type="text" placeholder="Facultative"></div><div class="field"><label>Date du règlement</label><input required name="paidAt" type="date" value="${today}"></div><div class="field"><label>Début demandé de la période</label><input name="paymentPeriodStart" type="date"><small>Laissez vide pour que le serveur calcule automatiquement la continuité.</small></div><div class="field"><label>Justificatif facultatif (PDF, PNG ou JPEG, 2 Mo max.)</label><input name="proof" type="file" accept="application/pdf,image/png,image/jpeg"></div><div class="field"><label>Notes internes</label><input maxlength="500" name="notes" type="text" placeholder="Facultatif"></div>`,async f=>{const payload={schoolId:id,amountReceivedXof:Math.round(Number(f.amountReceivedXof)),paymentMethod:f.paymentMethod,externalReference:String(f.externalReference||'').trim()||undefined,paidAt:f.paidAt,paymentPeriodStart:f.paymentPeriodStart||undefined,notes:String(f.notes||'').trim()||undefined},preview=await api('/platform/subscription-payments/preview',{method:'POST',body:JSON.stringify(payload)}),summary=`Établissement : ${preview.schoolName}\nPériode : ${new Date(preview.paymentPeriodStart).toLocaleDateString('fr-FR')} au ${new Date(preview.paymentPeriodEnd).toLocaleDateString('fr-FR')}\nTarif attendu : 50 000 FCFA\nMontant enregistré : ${new Intl.NumberFormat('fr-FR').format(preview.amountReceivedXof)} FCFA\nMoyen déclaré : ${platformMethodLabel(preview.paymentMethod)}\n\nConfirmer cet enregistrement manuel ?`;if(!confirm(summary))throw Error('Enregistrement annulé avant confirmation');payload.proof=await fileToProof(f.proof);await api('/platform/subscription-payments',{method:'POST',body:JSON.stringify(payload)});toast('Règlement confirmé et abonnement mis à jour');navigate('clients')})}
function cancelSubscriptionPaymentModal(id){openModal('Annuler un règlement enregistré',`<div class="msg">Le règlement ne sera pas supprimé. Son annulation, son motif et l’état recalculé de l’abonnement seront audités.</div><div class="field"><label>Motif de l’annulation</label><input required minlength="8" maxlength="500" name="reason" type="text"></div>`,async f=>{await api('/platform/subscription-payments/'+id+'/cancel',{method:'POST',body:JSON.stringify({reason:f.reason})});navigate('clients')})}

function editStudent(id){const s=cache.students.find(x=>x.id===id);if(!s)return;const input=(n,l,t,v,required=true)=>`<div class="field"><label>${l}</label><input ${required?'required':''} name="${n}" type="${t}" value="${esc(v||'')}"></div>`;openModal('Modifier l’élève',input('matricule','Matricule','text',s.matricule)+input('firstName','Prénom','text',s.first_name)+input('lastName','Nom','text',s.last_name)+input('className','Classe','text',s.class_name,false)+input('guardianName','Nom du parent','text',s.guardian_name,false)+input('guardianPhone','Téléphone du parent','tel',s.guardian_phone,false),async f=>{await api('/students/'+id,{method:'PUT',body:JSON.stringify(f)});navigate('students')})}
function invoiceModal(){if(!cache.students.length){toast('Ajoutez d’abord un élève');return navigate('students')}const due=new Date().toISOString().slice(0,10);openModal('Ajouter des frais à un élève',`<div class="field"><label>Élève</label><select name="studentId"><option value="all">Tous les élèves actifs</option>${cache.students.map(s=>`<option value="${s.id}">${esc(s.first_name+' '+s.last_name+' — '+s.matricule)}</option>`).join('')}</select></div><div class="field"><label>Rubrique</label><select name="feeType" data-change="toggleCustomFee(this.value)"><option value="registration">Frais d’inscription</option><option value="uniform">Tenue scolaire</option><option value="tuition">Mensualité</option><option value="transport">Transport scolaire</option><option value="other">Autre rubrique</option></select></div><div id="customFee" class="field hidden"><label>Nom de la rubrique personnalisée</label><input name="customLabel" type="text" placeholder="Ex. Cantine"></div><div class="field"><label>Montant</label><input required min="1" step="1" name="amount" type="number"></div><div class="field"><label>Devise</label><select name="currency"><option>XOF</option><option>EUR</option><option>USD</option><option>GBP</option><option>MAD</option><option>GNF</option><option>GMD</option><option>NGN</option></select></div><div class="field"><label>Date limite de paiement</label><input required name="dueDate" type="date" value="${due}"></div>`,async f=>{const labels={registration:'Frais d’inscription',uniform:'Tenue scolaire',tuition:'Mensualité',transport:'Transport scolaire'};const label=f.feeType==='other'?String(f.customLabel||'').trim():labels[f.feeType];if(!label)throw Error('Indiquez le nom de la rubrique');const endpoint=f.studentId==='all'?'/invoices/bulk':'/invoices';const result=await api(endpoint,{method:'POST',body:JSON.stringify({...f,label,amountMinor:Math.round(Number(f.amount)*100)})});if(result.created)toast(result.created+' échéance(s) créée(s)');navigate('invoices')})}
function paymentModal(){const inv=cache.invoices.filter(i=>i.status!=='paid'&&i.status!=='cancelled');if(!cache.students.length){toast('Ajoutez d’abord un élève');return navigate('students')}if(!inv.length){toast('Créez d’abord une échéance non réglée');return navigate('invoices')}openModal('Enregistrer un paiement scolaire',`<div class="msg">Ce paiement concerne les frais d’un élève et reste distinct de l’abonnement SCOLARIS PAY de l’établissement.</div><div class="field"><label>Échéance</label><select name="invoiceId" id="invoiceSelect">${inv.map(i=>`<option value="${i.id}" data-currency="${i.currency}">${esc(i.first_name+' '+i.last_name+' — '+i.label+' — '+money(Number(i.amount_minor)-Number(i.paid_minor),i.currency))}</option>`).join('')}</select></div><div class="field"><label>Montant encaissé</label><input required min="1" step="1" name="amount" type="number"></div><div class="field"><label>Méthode de paiement</label><select name="method"><option>Espèces</option><option>Wave</option><option>Orange Money</option><option>Virement</option><option>Carte bancaire</option><option>Chèque</option><option>Autre</option></select></div><div class="field"><label>Référence <small>(facultative)</small></label><input name="reference" type="text" placeholder="Générée automatiquement si ce champ est vide"></div>`,async f=>{const i=inv.find(x=>x.id===f.invoiceId);await api('/student-fee-payments',{method:'POST',body:JSON.stringify({...f,amountMinor:Math.round(Number(f.amount)*100),currency:String(i.currency).trim().toUpperCase()})});toast('Paiement scolaire et reçu enregistrés');navigate('payments')})}
function fields(xs){return xs.map(([n,l,t])=>`<div class="field"><label>${esc(l)}</label><input required name="${esc(n)}" type="${esc(t)}" ${t==='number'?'min="0" step="0.01"':''} ${t==='password'?'minlength="12" maxlength="200" autocomplete="new-password"':t==='email'?'autocomplete="email" maxlength="254"':''}></div>`).join('')}
