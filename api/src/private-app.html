function importStudentsModal(){let payload=null,preview=null;$('#modalTitle').textContent='Importer des élèves';$('#modalForm').innerHTML=`<p>Formats acceptés : Excel .xlsx ou CSV. Colonnes obligatoires : <b>prénom, nom</b>. Le matricule est facultatif et sera généré automatiquement s’il manque. Colonnes facultatives : classe, parent, téléphone.</p><div class="field"><label>Fichier des élèves</label><input required id="studentFile" type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div><div id="importPreview"></div><button class="primary" id="importBtn">Analyser le fichier</button><div id="modalMsg" class="msg hidden"></div>`;$('#modal').classList.remove('hidden');$('#modalForm').onsubmit=async e=>{e.preventDefault();const btn=$('#importBtn'),msg=$('#modalMsg');btn.disabled=true;msg.classList.add('hidden');try{if(!payload){const file=$('#studentFile').files[0];if(!file)throw Error('Choisissez un fichier');const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));payload={fileName:file.name,mimeType:file.type||(/\.csv$/i.test(file.name)?'text/csv':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),fileBase64:btoa(binary)};preview=await api('/students/import',{method:'POST',body:JSON.stringify({...payload,preview:true})});$('#importPreview').innerHTML=`<div class="panel" style="margin:14px 0"><b>${preview.valid} ligne(s) valide(s)</b><p>${preview.invalidLines.length?`Lignes invalides : ${preview.invalidLines.join(', ')}`:'Aucune ligne invalide.'}</p><small>Aperçu : ${preview.sample.slice(0,3).map(x=>esc((x.matricule||'Matricule automatique')+' — '+x.firstName+' '+x.lastName)).join('<br>')}</small></div>`;btn.textContent=`Importer ${preview.valid} élève(s)`;btn.disabled=false;return}const result=await api('/students/import',{method:'POST',body:JSON.stringify(payload)});closeModal();toast(`${re function paymentModal(){const inv=cache.invoices.filter(i=>!['paid','cancelled','exempted'].includes(i.financial_status)&&Number(i.balance_xof)>0);if(!cache.students.length){toast('Ajoutez d’abord un élève');return navigate('students')}if(!inv.length){toast('Créez d’abord une échéance non réglée');return navigate('invoices')}openModal('Enregistrer et ventiler un paiement',`<div class="msg">Enregistrez uniquement une somme déjà reçue par l’établissement. Cette opération ne déclenche aucun paiement en ligne et reste séparée de l’abonnement SCOLARIS PAY.</div><p>Sélectionnez une ou plusieurs échéances du même élève et indiquez le montant affecté à chacune.</p><div style="display:grid;gap:9px">${inv.map(i=>`<div class="panel" style="padding:12px"><label style="display:grid;grid-template-columns:auto 1fr minmax(120px,.35fr);gap:10px;align-items:center"><input type="checkbox" data-payment-invoice="${i.id}"><span><b>${esc(i.first_name+' '+i.last_name)}</b> · ${esc(i.matricule)}<br><small>${esc(feeName(i.fee_type))} · ${esc(i.class_name||'—')} · attendu ${money(Number(i.amount_due_xof)*100,'XOF')} · déjà payé ${money(Number(i.amount_paid_xof)*100,'XOF')} · solde ${money(Number(i.balance_xof)*100,'XOF')}</small></span><input aria-label="Montant affecté à ${esc(i.label)}" min="1" max="${i.balance_xof}" step="1" data-payment-amount="${i.id}" type="number" placeholder="XOF"></label></div>`).join('')}</div><div class="field"><label>Méthode déclarée</label><select name="method"><option>Espèces</option><option>Wave</option><option>Orange Money</option><option>Virement</option><option>Carte bancaire</option><option>Chèque</option><option>Autre</option></select></div><div class="field"><label>Référence <small>(facultative)</small></label><input maxlength="120" name="reference" placeholder="Générée automatiquement si vide"></div>`,async f=>{const allocations=[...document.querySelectorAll('[data-payment-invoice]:checked')].map(box=>{const invoice=inv.find(x=>x.id===box.dataset.payment async function renderTimetable(){const manage=['owner','director'].includes(user.role);if(user.role==='teacher')cache.timetableMode='teacher';const requests=[api('/academic-years'),api('/classes'),api('/timetable-entries')];if(manage)requests.push(api('/teachers'),api('/subjects'),api('/rooms'),api('/teaching-assignments'));const values=await Promise.all(requests);[cache.academicYears,cache.classes,cache.timetable]=values;if(manage)[cache.teachers,cache.subjects,cache.rooms,cache.assignments]=values.slice(3);const years=cache.academicYears.filter(x=>x.is_current),year=years[0]||cache.academicYears[0],active=cache.timetable.filter(x=>x.active&&(!year||x.academic_year_id===year.id)),visible=active.filter(x=>(cache.timetableMode!=='class'||!cache.timetableClass||x.class_id===cache.timetableClass)&&(cache.timetableMode!=='teacher'||!cache.timetableTeacher||x.teacher_id===cache.timetableTeacher)),days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'],dayMarkup=days.map((day,index)=>`<section class="schedule-day"><h3>${day}</h3>${visible.filter(x=>Number(x.weekday)===index+1).map(x=>timetableCard(x,manage)).join('')||'<div class="empty" style="padding:18px 4px">Aucun cours</div>'}</section>`).join(''),filter=cache.timetableMode==='class'?`<div class="field"><label>Classe</label><select data-change="setTimetableClass(this.value)"><option value="">Toutes les classes</option>${cache.classes.filter(x=>!year||x.academic_year_id===year.id).map(x=>`<option value="${x.id}" ${cache.timetableClass===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:manage?`<div class="field"><label>Enseignant</label><select data-change="setTimetableTeacher(this.value)"><option value="">Tous les enseignants</option>${cache.teachers.map(x=>`<option value="${x.id}" ${cache.timetableTeacher===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:`<div class="panel" style="padding:12px">Vos cours uniquement</div>`;$('#content').innerHTML=`<div class="section-head"><div><h2>${esc(year?.label||'Année scolaire')}</h2><small>${visible.length} créneau(x) actif(s)</small></div>${manage?'<div><button class="ghost" data-action="subjectModal()">+ Matière</button> <button class="ghost" data-action="roomModal()">+ Salle</button> <button class="ghost" data-action="assignmentModal()">+ Affectation</button> <button class="action" data-action="timetableEntryModal()">+ Créneau</button></div>':''}</div><div class="panel schedule-tools"><div class="tabs" style="margin:0"><button class="${cache.timetableMode==='class'?'active':''}" data-action="setTimetableMode('class')">Vue classe</button><button class="${cache.timetableMode==='teacher'?'active':''}" data-action="setTimetableMode('teacher')">Vue enseignant</button></div>${filter}</div>${active.length?`<div class="schedule-week" style="margin-top:16px">${dayMarkup}</div><div class="schedule-agenda" style="margin-top:16px">${dayMarkup}</div>`:`<div class="panel empty" style="margin-top:16px"><b>Aucun cours planifié.</b><br>${manage?'Créez une matière, une salle, une affectation pédagogique puis un créneau.':'La direction n’a pas encore publié votre emploi du temps.'}</div>`}`}

async function renderAttendance(){cache.attendanceMode='call';if(!cache.academicYears.length||!cache.classes.length||!cache.subjects.length||!cache.teachers.length)[cache.academicYears,cache.classes,cache.subjects,cache.teachers]=await Promise.all([api('/academic-years'),api('/classes'),api('/subjects'),api('/teachers')]);const query=new URLSearchParams({date:cache.attendanceDate});if(cache.attendanceClass)query.set('classId',cache.attendanceClass);if(cache.attendanceSubject)query.set('subjectId',cache.attendanceSubject);if(cache.attendanceTeacher&&user.role!=='teacher')query.set('teacherId',cache.attendanceTeacher);cache.attendanceSessions=await api('/attendance/sessions?'+query);if(cache.attendanceSession&&!cache.attendanceSessions.some(x=>x.id===cache.attendanceSession))cache.attendanceSession='';const selected=cache.attendanceSession||cache.attendanceSessions[0]?.id||'';cache.attendanceSession=selected;$('#content').innerHTML=`${attendanceTabs()}<div class="panel attendance-tools"><div class="field"><label>Date</label><input type="date" value="${esc(cache.attendanceDate)}" data-change="setAttendanceDate(this.value)"></div><div class="field"><label>Classe</label><select data-change="setAttendanceClass(this.value)"><option value="">Toutes les classes</option>${cache.classes.map(x=>`<option value="${x.id}" ${cache.attendanceClass===x.id?'selected':''}>${esc(x.name+' · '+x.academic_year)}</option>`).join('')}</select></div><div class="field"><label>Matière</label><select data-change="setAttendanceSubject(this.value)"><option value="">Toutes les matières</option>${cache.subjects.filter(x=>x.active).map(x=>`<option value="${x.id}" ${cache.attendanceSubject===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${user.role==='teacher'?'':`<div class="field"><label>Enseignant</label><select data-change="setAttendanceTeacher(this.value)"><option value="">Tous les enseignants</option>${cache.teachers.map(x=>`<option value="${x.id}" ${cache.attendanceTeacher===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}<div class="field"><label>Séance</label><select data-change="loadAttendanceSession(this.value)"><option value="">Choisir une séance</option>${cache.attendanceSessions.map(x=>`<option value="${x.id}" ${selected===x.id?'selected':''}>${esc(String(x.start_time).slice(0,5)+' · '+x.class_name+' · '+x.subject_name+' · '+x.teacher_name)}</option>`).join('')}</select></div><div><small>${cache.attendanceSessions.length} séance(s) · les séances annulées restent visibles sans autoriser l’appel.</small></div></div><div id="attendanceRosterPanel">${selected?'<div class="loader">Chargement de la classe…</div>':'<div class="panel empty" style="margin-top:16px">Aucune séance réelle pour cette date. Matérialisez d’abord la séance depuis l’emploi du temps.</div>'}</div>`;if(selected)await loadAttendanceSession(selected)}
async function loadAttendanceSession(id){cache.attendanceSession=id;if(!id)return renderAttendance();cache.attendanceRoster=await api('/attendance/sessions/'+id+'/roster');cache.attendanceDraft=Object.fromEntries(cache.attendanceRoster.students.map(student=>[student.student_id,{status:student.status||null,version:student.version??null,justificationDocumentId:student.justification_document_id||null}]));renderAttendanceRoster()}
function setAttendanceStatus(key){const separator=key.lastIndexOf('_'),studentId=key.slice(0,separator),status=key.slice(separator+1);if(!cache.attendanceDraft[studentId])return;cache.attendanceDraft[studentId].status=status;const card=document.querySelector(`[data-attendance-student="${studentId}"]`);card?.querySelectorAll('[data-status]').forEach(button=>button.classList.toggle('selected',button.dataset.status===status));card?.querySelector('[data-arrival]')?.closest('.field')?.classList.toggle('hidden',status!=='late');card?.querySelector('[data-reason]')?.closest('.field')?.classList.toggle('hidden',status!=='excused')}
function markAllPresent(){for(const student of cache.attendanceRoster?.students||[])cache.attendanceDraft[student.student_id].status='present';renderAttendanceRoster()}
function renderAttendanceRoster(){const target=$('#attendanceRosterPanel'),data=cache.attendanceRoster;if(!target||!data)return;const session=data.session,cancelled=session.status==='cancelled';target.innerHTML=`<div class="section-head"><div><h2>${esc(session.class_name+' · '+session.subject_name)}</h2><small>${new Date(session.session_date).toLocaleDateString('fr-FR')} · ${esc(String(session.start_time).slice(0,5)+'–'+String(session.end_time).slice(0,5))} · ${esc(session.teacher_name)} · ${data.students.length} élève(s)</small></div>${cancelled?'':`<div><button class="ghost" data-action="markAllPresent()">✓ Marquer tous présents</button> <button class="action" data-action="saveAttendance()">Enregistrer l’appel</button></div>`}</div>${cancelled?'<div class="msg"><b>Séance annulée :</b> aucun appel ne peut être enregistré.</div>':`<div id="attendanceRoster" class="attendance-roster">${data.students.map(student=>attendanceStudentCard(student)).join('')}</div>`}`}
function attendanceStudentCard(student){const draft=cache.attendanceDraft[student.student_id]||{},status=draft.status,initials=(student.first_name?.[0]||'')+(student.last_name?.[0]||'');return `<article class="panel attendance-student" data-attendance-student="${student.student_id}"><div class="student-identity"><span class="student-avatar" aria-hidden="true">${esc(initials.toUpperCase())}</span><div><b>${esc(student.first_name+' '+student.last_name)}</b><br><small>${esc(student.matricule)}</small>${student.updated_by_name?`<small class="attendance-modified">Modifié par ${esc(student.updated_by_name)} · v${student.version}</small>`:''}</div></div><div class="attendance-actions" role="group" aria-label="Statut de ${esc(student.first_name+' '+student.last_name)}">${[['present','✓ Présent'],['absent','✕ Absent'],['late','◷ Retard'],['excused','▣ Justifié']].map(([value,label])=>`<button type="button" class="attendance-status ${status===value?'selected':''}" data-status="${value}" data-action="setAttendanceStatus('${student.student_id}_${value}')">${label}</button>`).join('')}</div><div class="attendance-details"><div class="field ${status==='late'?'':'hidden'}"><label>Heure d’arrivée</label><input type="time" data-arrival value="${esc(student.arrival_time?String(student.arrival_time).slice(0,5):'')}"></div><div class="field ${status==='excused'?'':'hidden'}"><label>Motif du justificatif</label><input maxlength="500" data-reason value="${esc(student.reason||'')}"></div><div class="field wide"><label>Commentaire</label><textarea maxlength="1000" data-comment>${esc(student.comment||'')}</textarea></div><div class="field wide"><label>Justificatif privé <small>(PDF, JPG ou PNG, 2 Mo max.)</small></label><input type="file" accept="application/pdf,image/jpeg,image/png" data-document></div></div></article>`}
async function fileToAttendanceDocument(file,studentId){if(!file||!file.size)return null;if(file.size>2097152)throw Error('Le justificatif ne doit pas dépasser 2 Mo');if(!['application/pdf','image/png','image/jpeg'].includes(file.type))throw Error('Le justificatif doit être un PDF, PNG ou JPEG');const bytes=new Uint8Array(await file.arrayBuffer());let raw='';for(let index=0;index<bytes.length;index+=32768)raw+=String.fromCharCode(...bytes.subarray(index,index+32768));return api('/attendance/justifications',{method:'POST',body:JSON.stringify({studentId,name:file.name,contentType:file.type,base64:btoa(raw)})})}
async function saveAttendance(){const students=cache.attendanceRoster?.students||[];if(!students.length)throw Error('Aucun élève à enregistrer');const records=[];for(const student of students){const draft=cache.attendanceDraft[student.student_id],card=document.querySelector(`[data-attendance-student="${student.student_id}"]`);if(!draft?.status)throw Error(`Choisissez un statut pour ${student.first_name} ${student.last_name}`);const reason=String(card?.querySelector('[data-reason]')?.value||'').trim();if(draft.status==='excused'&&!reason)throw Error(`Indiquez le motif pour ${student.first_name} ${student.last_name}`);const document=await fileToAttendanceDocument(card?.querySelector('[data-document]')?.files?.[0],student.student_id);records.push({studentId:student.student_id,status:draft.status,arrivalTime:draft.status==='late'?(card?.querySelector('[data-arrival]')?.value||undefined):undefined,reason:reason||undefined,comment:String(card?.querySelector('[data-comment]')?.value||'').trim()||undefined,justificationDocumentId:document?.id||draft.justificationDocumentId||undefined,expectedVersion:draft.version})}await api('/attendance/sessions/'+cache.attendanceSession+'/records',{method:'POST',body:JSON.stringify({records})});toast(`${records.length} présence(s) enregistrée(s)`);await loadAttendanceSession(cache.attendanceSession)}
async function renderAttendanceHistory(){cache.attendanceMode='history';if(!cache.attendanceHistoryFrom){const from=new Date();from.setDate(from.getDate()-30);cache.attendanceHistoryFrom=from.toISOString().slice(0,10)}if(!cache.classes.length)cache.classes=await api('/classes');const params=new URLSearchParams({from:cache.attendanceHistoryFrom,to:cache.attendanceHistoryTo}),rows=await api('/attendance/history?'+params);$('#content').innerHTML=`${attendanceTabs()}<div class="panel attendance-tools"><div class="field"><label>Du</label><input id="attendanceHistoryFrom" type="date" value="${esc(cache.attendanceHistoryFrom)}"></div><div class="field"><label>Au</label><input id="attendanceHistoryTo" type="date" value="${esc(cache.attendanceHistoryTo)}"></div><div><button class="action" data-action="renderAttendanceHistory()">Actualiser</button></div></div><div class="section-head"><h2>${rows.length} présence(s) renseignée(s)</h2></div><div class="attendance-desktop-history table-wrap"><table><thead><tr><th>Date</th><th>Élève</th><th>Classe / matière</th><th>Statut</th><th>Détail</th><th>Modification</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${new Date(row.session_date).toLocaleDateString('fr-FR')}<br><small>${esc(String(row.start_time).slice(0,5))}</small></td><td><b>${esc(row.first_name+' '+row.last_name)}</b><br><small>${esc(row.matricule)}</small></td><td>${esc(row.class_name)}<br><small>${esc(row.subject_name)}</small></td><td><span class="pill">${esc(attendanceLabel(row.status))}</span></td><td>${esc(row.reason||row.comment||row.arrival_time?String(row.arrival_time||row.reason||row.comment).slice(0,120):'—')}</td><td>${esc(row.updated_by_name||row.marked_by_name)}<br><small>v${row.version}</small></td></tr>`).join('')}</tbody></table></div><div class="attendance-mobile-history">${rows.map(row=>`<article class="panel"><b>${esc(row.first_name+' '+row.last_name)} · ${esc(attendanceLabel(row.status))}</b><p>${new Date(row.session_date).toLocaleDateString('fr-FR')} · ${esc(String(row.start_time).slice(0,5))}<br>${esc(row.class_name+' · '+row.subject_name)}</p><small>${esc(row.reason||row.comment||'Aucun détail')}</small></article>`).join('')||'<div class="empty">Aucune présence sur cette période.</div>'}</div>`;$('#attendanceHistoryFrom').onchange=event=>{cache.attendanceHistoryFrom=event.target.value};$('#attendanceHistoryTo').onchange=event=>{cache.attendanceHistoryTo=event.target.value}}
function attendanceSummaryCards(summary){const evolution=summary===cache.attendanceReport?.summary?attendancePeriodEvolution(cache.attendanceReport):'';return `<div class="metric-grid"><article class="card"><div class="k">Taux de présence</div><div class="v green">${summary.attendanceRate}%</div><small>Présents + retards</small></article><article class="card"><div class="k">Absences non justifiées</div><div class="v">${summary.absent}</div><small>${summary.absenceRate}% des appels</small></article><article class="card"><div class="k">Retards</div><div class="v orange">${summary.late}</div><small>${summary.lateRate}% des appels</small></article><article class="card"><div class="k">Absences justifiées</div><div class="v">${summary.excused}</div><small>${summary.excusedRate}% des appels</small></article></div>${evolution}`}
function attendancePeriodEvolution(report){const previous=report.previousComparison?`<div class="msg"><b>Comparaison :</b> la période précédente « ${esc(report.previousComparison.period.name)} » avait un taux de présence de ${report.previousComparison.summary.attendanceRate}% (${report.previousComparison.summary.marked} appels renseignés).</div>`:'';const rows=report.periodEvolution||[];return `${previous}${rows.length?`<div class="section-head"><h2>Évolution par période académique</h2></div><div class="table-wrap"><table><thead><tr><th>Période</th><th>Effectif</th><th>Séances</th><th>Présence</th><th>Absences</th><th>Retards</th><th>Justifiés</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.student_count}</td><td>${x.planned_sessions}</td><td>${x.attendanceRate}%</td><td>${x.absent}</td><td>${x.late}</td><td>${x.excused}</td></tr>`).join('')}</tbody></table></div>`:''}`}
async function renderAttendanceReports(){cache.attendanceMode='reports';if(!cache.academicYears.length||!cache.classes.length||!cache.students.length)[cache.academicYears,cache.classes,cache.students]=await Promise.all([api('/academic-years'),api('/classes'),api('/students')]);const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];if(!year){$('#content').innerHTML=attendanceTabs()+'<div class="empty">Créez une année scolaire avant les rapports.</div>';return}const periods=await api('/academic-periods?academicYearId='+year.id);if(cache.attendanceReportScope==='class'&&!cache.attendanceReportClass)cache.attendanceReportClass=cache.classes.find(x=>x.academic_year_id===year.id)?.id||'';if(cache.attendanceReportScope==='student'&&!cache.attendanceReportStudent)cache.attendanceReportStudent=cache.students[0]?.id||'';const params=new URLSearchParams({scope:cache.attendanceReportScope,academicYearId:year.id});if(cache.attendanceReportClass)params.set('classId',cache.attendanceReportClass);if(cache.attendanceReportStudent)params.set('studentId',cache.attendanceReportStudent);if(cache.attendanceReportPeriod)params.set('periodId',cache.attendanceReportPeriod);cache.attendanceReport=await api('/attendance/reports?'+params);const report=cache.attendanceReport,manage=['owner','director'].includes(user.role);$('#content').innerHTML=`${attendanceTabs()}<div class="panel attendance-tools"><div class="field"><label>Portée</label><select id="attendanceReportScope"><option value="school" ${cache.attendanceReportScope==='school'?'selected':''}>Établissement</option><option value="class" ${cache.attendanceReportScope==='class'?'selected':''}>Classe</option><option value="student" ${cache.attendanceReportScope==='student'?'selected':''}>Élève</option></select></div><div class="field"><label>Classe</label><select id="attendanceReportClass"><option value="">Choisir</option>${cache.classes.filter(x=>x.academic_year_id===year.id).map(x=>`<option value="${x.id}" ${cache.attendanceReportClass===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Élève</label><select id="attendanceReportStudent"><option value="">Choisir</option>${cache.students.map(x=>`<option value="${x.id}" ${cache.attendanceReportStudent===x.id?'selected':''}>${esc(x.first_name+' '+x.last_name+' · '+x.matricule)}</option>`).join('')}</select></div><div class="field"><label>Période</label><select id="attendanceReportPeriod"><option value="">Année complète</option>${periods.map(x=>`<option value="${x.id}" ${cache.attendanceReportPeriod===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><button class="action" data-action="loadAttendanceReport()">Calculer</button> <button class="ghost" data-action="downloadAttendanceReport()">↓ CSV</button>${manage?` <button class="ghost" data-action="academicPeriodModal()">+ Période</button>`:''}</div></div><div class="section-head"><div><h2>${esc(report.period?.name||report.academicYear)}</h2><small>${new Date(report.from).toLocaleDateString('fr-FR')} au ${new Date(report.to).toLocaleDateString('fr-FR')} · ${report.summary.marked} appel(s) renseigné(s) · ${report.summary.planned_sessions} séance(s) prévue(s)</small></div></div>${attendanceSummaryCards(report.summary)}<div class="report-months table-wrap"><table><thead><tr><th>Mois</th><th>Séances prévues</th><th>Réalisées</th><th>Présents</th><th>Retards</th><th>Absents</th><th>Justifiés</th><th>Taux présence</th></tr></thead><tbody>${report.monthly.map(x=>`<tr><td>${esc(x.month)}</td><td>${x.planned_sessions}</td><td>${x.realized_sessions}</td><td>${x.present}</td><td>${x.late}</td><td>${x.absent}</td><td>${x.excused}</td><td>${x.attendanceRate}%</td></tr>`).join('')||'<tr><td colspan="8">Aucune donnée</td></tr>'}</tbody></table></div>${report.mostAbsent?.length?`<div class="section-head"><h2>Suivi administratif des absences</h2></div><div class="table-wrap"><table><thead><tr><th>Matricule</th><th>Élève</th><th>Absences</th></tr></thead><tbody>${report.mostAbsent.map(x=>`<tr><td>${esc(x.matricule)}</td><td>${esc(x.first_name+' '+x.last_name)}</td><td>${x.absences}</td></tr>`).join('')}</tbody></table></div>`:''}<p><small>Formule : présence effective = présent + retard. Le dénominateur contient uniquement les appels renseignés. Une absence justifiée reste distincte et n’est jamais comptée comme présence.</small></p>`}
async function loadAttendanceReport(){cache.attendanceReportScope=$('#attendanceReportScope')?.value||'school';cache.attendanceReportClass=$('#attendanceReportClass')?.value||'';cache.attendanceReportStudent=$('#attendanceReportStudent')?.value||'';cache.attendanceReportPeriod=$('#attendanceReportPeriod')?.value||'';return renderAttendanceReports()}
async function downloadAttendanceReport(){const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];if(!year)throw Error('Année scolaire introuvable');const params=new URLSearchParams({scope:cache.attendanceReportScope,academicYearId:year.id});if(cache.attendanceReportClass)params.set('classId',cache.attendanceReportClass);if(cache.attendanceReportStudent)params.set('studentId',cache.attendanceReportStudent);if(cache.attendanceReportPeriod)params.set('periodId',cache.attendanceReportPeriod);return downloadFile('/api/attendance/reports.csv?'+params,'rapport-presences.csv','Rapport des présences téléchargé')}
function academicPeriodModal(){const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];if(!year)return toast('Créez d’abord une année scolaire');openModal('Créer une période académique',`<div class="msg">La période doit être entièrement comprise dans ${esc(year.label)}.</div><div class="field"><label>Nom</label><input required minlength="2" maxlength="100" name="name" placeholder="1er trimestre"></div><div class="field"><label>Type</label><select name="kind"><option value="trimester">Trimestre</option><option value="semester">Semestre</option><option value="term">Période</option><option value="other">Autre</option></select></div><div class="field"><label>Position</label><input required type="number" min="1" max="12" name="position" value="1"></div><div class="two"><div class="field"><label>Début</label><input required type="date" name="startsOn" value="${esc(String(year.starts_on).slice(0,10))}"></div><div class="field"><label>Fin</label><input required type="date" name="endsOn" value="${esc(String(year.ends_on).slice(0,10))}"></div></div>`,async f=>{await api('/academic-periods',{method:'POST',body:JSON.stringify({academicYearId:year.id,name:f.name,kind:f.kind,position:Number(f.position),startsOn:f.startsOn,endsOn:f.endsOn})});cache.attendanceReportPeriod='';renderAttendanceReports()})}
async function studentAttendance(id){if(!cache.academicYears.length)cache.academicYears=await api('/academic-years');const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];if(!year)throw Error('Année scolaire introuvable');const student=cache.students.find(x=>x.id===id),report=await api('/attendance/students/'+id+'/summary?academicYearId='+year.id);$('#modalTitle').textContent='Présences de l’élève';$('#modalForm').innerHTML=`<p><b>${esc(student?.first_name+' '+student?.last_name)}</b><br>${esc(student?.matricule||'')} · ${esc(year.label)}</p>${attendanceSummaryCards(report.summary)}<h3>Historique récent</h3>${report.history.map(x=>`<div class="panel" style="margin:8px 0"><b>${new Date(x.session_date).toLocaleDateString('fr-FR')} · ${esc(x.subject_name)}</b><br>${esc(attendanceLabel(x.status))}${x.arrival_time?' · arrivée '+esc(String(x.arrival_time).slice(0,5)):''}${x.reason?'<br><small>'+esc(x.reason)+'</small>':''}</div>`).join('')||'<div class="empty">Aucun appel renseigné.</div>'}<p><small>Présence effective = présents + retards. Les absences justifiées restent séparées.</small></p>`;$('#modalForm').onsubmit=event=>event.preventDefault();$('#modal').classList.remove('hidden')}
function gradeStatusLabel(value){return({draft:'Brouillon',published:'Publiée',locked:'Verrouillée',cancelled:'Annulée',scored:'Noté',absent:'Absent',excused:'Absence justifiée',exempt:'Dispensé',pending:'En attente'})[value]||value}
function gradeTabs(){return `<div class="tabs"><button class="${cache.gradeMode==='list'?'active':''}" data-action="setGradeMode('list')">Mes évaluations</button><button class="${cache.gradeMode==='reports'?'active':''}" data-action="setGradeMode('reports')">Rapports et moyennes</button></div>`}
async function loadGradeCore(){cache.academicYears=await api('/academic-years');const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];if(!year)return null;[cache.classes,cache.assignments,cache.gradeTypes,cache.gradeSettings,cache.students]=await Promise.all([api('/classes'),api('/teaching-assignments'),api('/assessment-types'),api('/grading-settings'),api('/students')]);cache.gradePeriods=await api('/academic-periods?academicYearId='+year.id);cache.gradePeriod=cache.gradePeriod||cache.gradePeriods[0]?.id||'';cache.gradeClass=cache.gradeClass||cache.classes.find(x=>x.academic_year_id===year.id)?.id||'';return year}
async function renderGrades(){cache.gradeMode='list';const year=await loadGradeCore();if(!year){$('#content').innerHTML=gradeTabs()+'<div class="empty">Créez une année scolaire avant les évaluations.</div>';return}const params=new URLSearchParams({academicYearId:year.id});if(cache.gradePeriod)params.set('academicPeriodId',cache.gradePeriod);if(cache.gradeClass)params.set('classId',cache.gradeClass);if(cache.gradeSubject)params.set('subjectId',cache.gradeSubject);if(cache.gradeTeacher)params.set('teacherId',cache.gradeTeacher);if(cache.gradeStatus)params.set('status',cache.gradeStatus);cache.gradeAssessments=await api('/assessments?'+params);const manage=['owner','director'].includes(user.role),rows=cache.gradeAssessments,subjects=[...new Map(cache.assignments.map(x=>[x.subject_id,{id:x.subject_id,name:x.subject_name}])).values()],teachers=[...new Map(cache.assignments.map(x=>[x.teacher_id,{id:x.teacher_id,name:x.teacher_name}])).values()];$('#content').innerHTML=`${gradeTabs()}<div class="section-head"><div><h2>${esc(year.label)}</h2><small>Année scolaire active · les enseignants ne voient que leurs affectations.</small></div><div>${manage?'<button class="ghost" data-action="gradingSettingsModal()">Règles de calcul</button> ':''}<button class="action" data-action="assessmentModal()">+ Évaluation</button></div></div><div class="panel grade-tools"><div class="field"><label>Période</label><select id="gradePeriod" data-change="setGradeFilter(this.value)"><option value="">Toutes</option>${cache.gradePeriods.map(x=>`<option value="${x.id}" ${cache.gradePeriod===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Classe</label><select id="gradeClass" data-change="setGradeFilter(this.value)"><option value="">Toutes</option>${cache.classes.filter(x=>x.academic_year_id===year.id).map(x=>`<option value="${x.id}" ${cache.gradeClass===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Matière</label><select id="gradeSubject" data-change="setGradeFilter(this.value)"><option value="">Toutes</option>${subjects.map(x=>`<option value="${x.id}" ${cache.gradeSubject===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Enseignant</label><select id="gradeTeacher" data-change="setGradeFilter(this.value)" ${manage?'':'disabled'}><option value="">Tous</option>${teachers.map(x=>`<option value="${x.id}" ${cache.gradeTeacher===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Statut</label><select id="gradeStatus" data-change="setGradeFilter(this.value)"><option value="">Tous</option>${['draft','published','locked','cancelled'].map(x=>`<option value="${x}" ${cache.gradeStatus===x?'selected':''}>${esc(gradeStatusLabel(x))}</option>`).join('')}</select></div></div><div class="section-head"><h2>${rows.length} évaluation(s)</h2></div><div class="grade-desktop table-wrap"><table><thead><tr><th>Date</th><th>Évaluation</th><th>Classe / matière</th><th>Coefficients</th><th>Statut</th><th>Saisie</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>gradeAssessmentRow(x,manage)).join('')||'<tr><td colspan="7" class="empty">Aucune évaluation pour ces filtres.</td></tr>'}</tbody></table></div><div class="grade-mobile">${rows.map(x=>gradeAssessmentCard(x,manage)).join('')||'<div class="empty">Aucune évaluation pour ces filtres.</div>'}</div>`}
function gradeAssessmentActions(x,manage){return `<div class="grade-actions"><button class="ghost" data-action="loadGradeAssessment('${x.id}')">Saisir les notes</button>${x.status==='draft'?`<button class="ghost" data-action="publishAssessment('${x.id}')">Publier</button>`:''}${manage&&x.status==='published'?`<button class="ghost" data-action="lockAssessment('${x.id}')">Verrouiller</button>`:''}${manage&&x.status==='locked'?`<button class="ghost" data-action="reopenAssessment('${x.id}')">Réouvrir</button>`:''}${manage&&['draft','published'].includes(x.status)?`<button class="ghost danger" data-action="cancelAssessment('${x.id}')">Annuler</button>`:''}</div>`}
function gradeAssessmentRow(x,manage){return `<tr><td>${new Date(x.assessment_date).toLocaleDateString('fr-FR')}</td><td><b>${esc(x.title)}</b><br><small>${esc(x.assessment_type)} · /${esc(x.maximum_score)}</small></td><td>${esc(x.class_name)}<br><small>${esc(x.subject_name)} · ${esc(x.teacher_name)}</small></td><td>Éval. ${esc(x.coefficient)}<br><button class="ghost" ${manage?`data-action="subjectCoefficientModal('${x.teaching_assignment_id}')"`:'disabled'}>Matière ${esc(x.subject_coefficient)}</button></td><td><span class="pill ${esc(x.status)}">${esc(gradeStatusLabel(x.status))}</span></td><td>${x.entered_count}/${x.student_count}<br><small>Moy. ${x.class_average??'—'}/${esc(x.scale_max)}</small></td><td>${gradeAssessmentActions(x,manage)}</td></tr>`}
function gradeAssessmentCard(x,manage){return `<article class="panel"><small>${new Date(x.assessment_date).toLocaleDateString('fr-FR')} · ${esc(x.assessment_type)}</small><h3>${esc(x.title)}</h3><p>${esc(x.class_name)} · ${esc(x.subject_name)}<br>Barème ${esc(x.maximum_score)} · coefficient ${esc(x.coefficient)} · matière ${esc(x.subject_coefficient)}</p><span class="pill ${esc(x.status)}">${esc(gradeStatusLabel(x.status))}</span><p>${x.entered_count}/${x.student_count} résultat(s) saisi(s) · moyenne ${x.class_average??'—'}/${esc(x.scale_max)}</p>${gradeAssessmentActions(x,manage)}</article>`}
function setGradeMode(mode){cache.gradeMode=mode;return mode==='reports'?renderGradeReports():renderGrades()}
function setGradeFilter(){cache.gradePeriod=$('#gradePeriod')?.value??cache.gradePeriod;cache.gradeClass=$('#gradeClass')?.value??cache.gradeClass;cache.gradeSubject=$('#gradeSubject')?.value??cache.gradeSubject;cache.gradeTeacher=$('#gradeTeacher')?.value??cache.gradeTeacher;cache.gradeStatus=$('#gradeStatus')?.value??cache.gradeStatus;return renderGrades()}
function assessmentModal(){const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0],period=cache.gradePeriods.find(x=>x.id===cache.gradePeriod)||cache.gradePeriods[0],assignments=cache.assignments.filter(x=>x.academic_year_id===year?.id&&x.status==='active');if(!period)return toast('Créez une période académique avant une évaluation');if(!assignments.length)return toast('Créez une affectation pédagogique avant une évaluation');openModal('Créer une évaluation',`<div class="field"><label>Affectation</label><select required name="teachingAssignmentId">${assignments.map(x=>`<option value="${x.id}">${esc(x.class_name+' · '+x.subject_name+' · '+x.teacher_name)}</option>`).join('')}</select></div><div class="field"><label>Période</label><select required name="academicPeriodId">${cache.gradePeriods.map(x=>`<option value="${x.id}" ${x.id===period.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select required name="assessmentTypeId">${cache.gradeTypes.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Titre</label><input required minlength="2" maxlength="160" name="title" placeholder="Devoir 1"></div><div class="field"><label>Date</label><input required type="date" name="assessmentDate" value="${esc(String(period.starts_on).slice(0,10))}"></div><div class="two"><div class="field"><label>Barème maximal</label><input required type="number" min="0.01" max="100000" step="0.01" name="maximumScore" value="20"></div><div class="field"><label>Coefficient de l’évaluation</label><input required type="number" min="0.0001" max="1000" step="0.0001" name="coefficient" value="1"></div></div>`,async f=>{await api('/assessments',{method:'POST',body:JSON.stringify({academicYearId:year.id,...f})});renderGrades()})}
function subjectCoefficientModal(id){const assignment=cache.assignments.find(x=>x.id===id);if(!assignment)return;openModal('Coefficient de la matière',`<p><b>${esc(assignment.subject_name)}</b> · ${esc(assignment.class_name)}</p><div class="field"><label>Coefficient</label><input required type="number" min="0.0001" max="1000" step="0.0001" name="subjectCoefficient" value="${esc(assignment.subject_coefficient||1)}"></div>`,async f=>{await api('/teaching-assignments/'+id+'/coefficient',{method:'PUT',body:JSON.stringify(f)});renderGrades()})}
async function loadGradeAssessment(id){cache.gradeAssessment=id;cache.gradeRoster=await api('/assessments/'+id+'/roster');cache.gradeDraft={};for(const x of cache.gradeRoster.students)cache.gradeDraft[x.student_id]={status:x.status||'pending'};const a=cache.gradeRoster.assessment,editable=!['locked','cancelled'].includes(a.status);$('#content').innerHTML=`${gradeTabs()}<div class="section-head"><div><button class="ghost" data-action="renderGrades()">← Retour</button><h2>${esc(a.title)}</h2><small>${esc(a.class_name+' · '+a.subject_name)} · barème ${esc(a.maximum_score)} · ${esc(gradeStatusLabel(a.status))}</small></div></div><div class="grade-roster">${cache.gradeRoster.students.map(x=>gradeStudentCard(x,a,editable)).join('')||'<div class="empty">Aucun élève inscrit à la date de cette évaluation.</div>'}</div>${editable&&cache.gradeRoster.students.length?`<div class="grade-savebar"><span><b>${cache.gradeRoster.students.length} élève(s)</b><br><small>${a.status==='published'?'Toute correction exige un motif.':'Brouillon enregistrable avant publication.'}</small></span><button class="action" data-action="saveGrades()">Enregistrer les notes</button></div>`:''}`}
function gradeStudentCard(x,a,editable){const status=x.status||'pending',score=x.score??'';return `<article class="panel grade-student" data-grade-student="${x.student_id}"><div class="student-identity"><div class="student-avatar">${esc((x.first_name?.[0]||'')+(x.last_name?.[0]||''))}</div><div><b>${esc(x.first_name+' '+x.last_name)}</b><br><small>${esc(x.matricule)}${x.version?' · version '+x.version:''}</small></div></div><div class="field"><label>Statut</label><select data-change="setGradeStatus('${x.student_id}')" ${editable?'':'disabled'}>${['scored','absent','excused','exempt','pending'].map(value=>`<option value="${value}" ${status===value?'selected':''}>${esc(gradeStatusLabel(value))}</option>`).join('')}</select></div><div class="field grade-score ${status==='scored'?'':'hidden'}"><label>Note / ${esc(a.maximum_score)}</label><input type="number" min="0" max="${esc(a.maximum_score)}" step="0.01" value="${esc(score)}" ${editable?'':'disabled'}></div><div class="field grade-comment"><label>Commentaire</label><input maxlength="1000" value="${esc(x.comment||'')}" ${editable?'':'disabled'}></div></article>`}
function setGradeStatus(id){const card=document.querySelector(`[data-grade-student="${id}"]`),status=card?.querySelector('select')?.value||'pending';cache.gradeDraft[id]={status};card?.querySelector('.grade-score')?.classList.toggle('hidden',status!=='scored')}
async function saveGrades(){const a=cache.gradeRoster.assessment,grades=cache.gradeRoster.students.map(x=>{const card=document.querySelector(`[data-grade-student="${x.student_id}"]`),status=card.querySelector('select').value,score=card.querySelector('.grade-score input').value,comment=card.querySelector('.grade-comment input').value.trim();if(status==='scored'&&score==='')throw Error('Renseignez la note de '+x.first_name+' '+x.last_name);return{studentId:x.student_id,status,...(status==='scored'?{score}:{}),comment:comment||undefined,expectedVersion:x.version||undefined}}),reason=a.status==='published'?window.prompt('Motif obligatoire de la correction (8 caractères minimum) :'):undefined;if(a.status==='published'&&(!reason||reason.trim().length<8))throw Error('Le motif de correction est obligatoire');await api('/assessments/'+a.id+'/grades',{method:'POST',body:JSON.stringify({assessmentVersion:a.version,grades,reason})});toast('Notes enregistrées');await loadGradeAssessment(a.id)}
async function assessmentWorkflow(id,action,options={}){const assessment=cache.gradeAssessments.find(x=>x.id===id)||cache.gradeRoster?.assessment;if(!assessment)throw Error('Évaluation introuvable');await api('/assessments/'+id+'/'+action,{method:'POST',body:JSON.stringify({expectedVersion:assessment.version,...options})});toast(action==='publish'?'Évaluation publiée':action==='lock'?'Évaluation verrouillée':action==='reopen'?'Évaluation réouverte':'Évaluation annulée');return renderGrades()}
async function publishAssessment(id){try{return await assessmentWorkflow(id,'publish')}catch(error){const summary=error.details?.publicationSummary;if(!error.details?.confirmationRequired||!summary)throw error;const message=`Cette évaluation contient encore des résultats en attente.\n\nTotal : ${summary.total}\nNotés : ${summary.scored}\nAbsents : ${summary.absent}\nJustifiés : ${summary.excused}\nDispensés : ${summary.exempt}\nEn attente : ${summary.pending}\n\nConfirmer une publication exceptionnelle ?`;if(!confirm(message))return;const reason=window.prompt('Motif obligatoire de la publication avec des résultats en attente (8 caractères minimum) :');if(!reason||reason.trim().length<8)throw Error('Le motif est obligatoire');return assessmentWorkflow(id,'publish',{confirmPending:true,reason:reason.trim()})}}
function lockAssessment(id){if(!confirm('Verrouiller définitivement les notes de cette évaluation ?'))return;return assessmentWorkflow(id,'lock')}
function reopenAssessment(id){const reason=window.prompt('Motif de réouverture (8 caractères minimum) :');if(!reason||reason.trim().length<8)return;return assessmentWorkflow(id,'reopen',{reason})}
function cancelAssessment(id){const assessment=cache.gradeAssessments.find(x=>x.id===id)||cache.gradeRoster?.assessment;if(!confirm('Annuler cette évaluation ?'))return;const reason=assessment?.status==='published'?window.prompt('Motif obligatoire de l’annulation (8 caractères minimum) :'):'';if(assessment?.status==='published'&&(!reason||reason.trim().length<8))return;return assessmentWorkflow(id,'cancel',reason?{reason:reason.trim()}:{})}
async function renderGradeReports(){cache.gradeMode='reports';const year=await loadGradeCore();if(!year||!cache.gradePeriods.length){$('#content').innerHTML=gradeTabs()+'<div class="empty">Créez une période académique avant les rapports.</div>';return}await loadGradeReport(false)}
async function loadGradeReport(updateFilters=true){if(updateFilters){cache.gradePeriod=$('#gradeReportPeriod')?.value||cache.gradePeriod;cache.gradeClass=$('#gradeReportClass')?.value||cache.gradeClass}if(!cache.gradePeriod||!cache.gradeClass){$('#content').innerHTML=gradeTabs()+'<div class="empty">Choisissez une période et une classe.</div>';return}cache.gradeReport=await api('/grade-reports?scope=class&academicPeriodId='+cache.gradePeriod+'&classId='+cache.gradeClass);const rows=cache.gradeReport.rows,studentCount=new Set(rows.map(x=>x.student_id)).size;$('#content').innerHTML=`${gradeTabs()}<div class="panel grade-tools"><div class="field"><label>Période</label><select id="gradeReportPeriod">${cache.gradePeriods.map(x=>`<option value="${x.id}" ${cache.gradePeriod===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Classe</label><select id="gradeReportClass">${cache.classes.map(x=>`<option value="${x.id}" ${cache.gradeClass===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><button class="action" data-action="loadGradeReport()">Calculer</button> <button class="ghost" data-action="downloadGradeReport()">↓ CSV</button></div></div><div class="section-head"><div><h2>${studentCount} élève(s) avec résultats officiels</h2><small>Chaque résultat officiel conserve l’échelle, l’arrondi, la politique d’absence et les coefficients de son snapshot de publication.</small></div></div><div class="table-wrap"><table><thead><tr><th>Élève</th><th>Matière</th><th>Coefficient</th><th>Moyenne matière</th><th>Moyenne générale</th><th>Résultats</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.first_name+' '+x.last_name)}<br><small>${esc(x.matricule)}</small></td><td>${esc(x.subject_name)}</td><td>${esc(x.subject_coefficient)}</td><td class="grade-average">${x.subject_average??'—'}/${esc(x.scale_max)}</td><td class="grade-average">${x.general_average??'—'}/${esc(x.scale_max)}</td><td>${x.result_count}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucun résultat publié pour cette sélection.</td></tr>'}</tbody></table></div><p><small>Les notes en attente, absences justifiées et dispenses sont exclues du dénominateur. Les arrondis intermédiaires ne sont jamais utilisés.</small></p>`}
function downloadGradeReport(){return downloadFile('/api/grade-reports.csv?scope=class&academicPeriodId='+cache.gradePeriod+'&classId='+cache.gradeClass,'releve-notes.csv','Relevé de notes téléchargé')}
function gradingSettingsModal(){const s=cache.gradeSettings,year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];openModal('Règles de calcul',`<div class="field"><label>Échelle commune</label><input required type="number" min="1" max="1000" step="0.01" name="scaleMax" value="${esc(s.scale_max)}"></div><div class="field"><label>Décimales affichées</label><select name="roundingPrecision">${[0,1,2,3,4].map(x=>`<option value="${x}" ${Number(s.rounding_precision)===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Absence non justifiée</label><select name="absencePolicy"><option value="exclude" ${s.absence_policy==='exclude'?'selected':''}>Exclure de la moyenne</option><option value="zero" ${s.absence_policy==='zero'?'selected':''}>Compter comme zéro</option></select></div><div class="msg">Cette nouvelle version s’applique aux futurs brouillons de ${esc(year?.label||'l’année active')}. Les résultats déjà publiés conservent leur snapshot.</div>`,async f=>{await api('/grading-settings',{method:'PUT',body:JSON.stringify({...f,academicYearId:year.id,roundingPrecision:Number(f.roundingPrecision),missingGradePolicy:'exclude'})});renderGradeReports()})}
async function studentGrades(id){if(!cache.academicYears.length)cache.academicYears=await api('/academic-years');const year=cache.academicYears.find(x=>x.is_current)||cache.academicYears[0];if(!year)throw Error('Année scolaire introuvable');const periods=await api('/academic-periods?academicYearId='+year.id),period=periods[0];if(!period)throw Error('Aucune période académique');const report=await api('/students/'+id+'/grades?academicPeriodId='+period.id),student=cache.students.find(x=>x.id===id);$('#modalTitle').textContent='Notes de l’élève';$('#modalForm').innerHTML=`<p><b>${esc(student?.first_name+' '+student?.last_name)}</b><br>${esc(student?.matricule||'')} · ${esc(period.name)}</p><h3>Moyennes par matière</h3>${report.rows.map(x=>`<div class="panel" style="margin:8px 0"><b>${esc(x.subject_name)}</b><br><span class="grade-average">${x.subject_average??'—'}/${esc(x.scale_max)}</span> · coefficient ${esc(x.subject_coefficient)}<br><small>Moyenne générale ${x.general_average??'—'}/${esc(x.scale_max)}</small></div>`).join('')||'<div class="empty">Aucun résultat publié.</div>'}<h3>Évaluations officielles</h3>${report.assessments.map(x=>`<div class="panel" style="margin:8px 0"><b>${esc(x.subject_name+' · '+x.title)}</b><br>${new Date(x.assessment_date).toLocaleDateString('fr-FR')} · ${x.status==='scored'?`${esc(x.score)}/${esc(x.maximum_score)} · normalisée ${esc(x.normalized_score)}/${esc(x.scale_max)}`:esc(gradeStatusLabel(x.status||'pending'))}<br><small>Coefficient ${esc(x.coefficient)}${x.comment?' · '+esc(x.comment):''}</small></div>`).join('')||'<div class="empty">Aucune évaluation publiée.</div>'}`;$('#modalForm').onsubmit=event=>event.preventDefault();$('#modal').classList.remove('hidden')}
function fields(xs){return xs.map(([n,l,t])=>`<div class="field"><label>${esc(l)}</label><input required name="${esc(n)}" type="${esc(t)}" ${t==='number'?'min="0" step="0.01"':''} ${t==='password'?'minlength="12" maxlength="200" autocomplete="new-password"':t==='email'?'autocomplete="email" maxlength="254"':''}></div>`).join('')}
showApp();
</script></body></html>
